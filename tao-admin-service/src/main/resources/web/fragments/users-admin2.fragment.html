	.flex-row>*:last-child    {overflow:auto;}
	@media (max-width: 450px) {

	};

<script type="text/javascript">
	// Enable/Disable/Delete user account
	var manageUser = function (action, dna) {
		var settings = {
			cache  : false,
			url    : baseRestApiURL + "admin/users/" + dna.id + (action === "delete" ? "" : "/" + action),
			method : action === "delete" ? "DELETE" : "POST",
			headers: {
				"Content-Type" : "application/json",
				"Cache-Control": "no-cache",
				"X-Auth-Token" : window.tokenKey
			}
		};
		(action === "disable") && (settings.data = '{"deletePrivateResources": true}');
		$.ajax(settings)
			.done(function (response) {
				showMsg("User " + dna.fullName + " successfully " + action + "d.", "SUCCESS");
				panelComp.refreshData();
			});
	};
	
	// Show modal actions
	var myModalNodesOpShow = function (operationid, dna) {
		window.userOpStack = [];
		var rm_contentUrl = "";
		var $modal  = $("#myModalNodes");
		var $dialog = $(".modal-dialog", $modal).removeAttr("style");
		switch (operationid) {
			case "op-plus"  : window.userOpStack =  { "action": "plus"                      } ; rm_contentUrl = "./fragments/users-plus.fragment.html?"     + Math.random(); break;
			case "edit"     : window.userOpStack =  { "action": "edit"         , "dna": dna } ; rm_contentUrl = "./fragments/users-plus.fragment.html?"     + Math.random(); break;
			case "resources": window.userOpStack = [{ "action": "resource_edit", "dna": dna }]; rm_contentUrl = "./fragments/user-node_edit.fragment.html?" + Math.random(); $dialog.css({"width":"1200px", "padding":"25px"}); break;
		}
		if (rm_contentUrl !== "") {
			$.ajax({
				url    : rm_contentUrl,
				success: function (result) {
					if (result !== "") {
						$dialog.html(result);
					} else {
						alert("Could not retrive needed data from server.");
						return e.preventDefault();
					}
					$modal.modal("show");
				}
			});
		} else {
			alert("TAO - Operation mismatch");
		}
	};
	
    $(document).ready(function () {
		var $selectActivePanel = $("#selectActivePanel");
		var urls = [];
		var actionsSet = {
			"active_users"  : { badgeLabel: "Active"  , pagLabel: "active users"  , emptyLabel: "active user account"  , url: baseRestApiURL + "admin/users?status=ACTIVE"   },
			"pending_users" : { badgeLabel: "Pending" , pagLabel: "pending users" , emptyLabel: "pending user account" , url: baseRestApiURL + "admin/users?status=PENDING"  },
			"disabled_users": { badgeLabel: "Disabled", pagLabel: "disabled users", emptyLabel: "disabled user account", url: baseRestApiURL + "admin/users?status=DISABLED" }
		};
		var getActiveSet = function (data, sets) {
			var action = $('[data-toggle="tab"][aria-expanded="true"]', $selectActivePanel).data("action");
			var selected = (typeof action === "undefined" || typeof actionsSet[action].filter === "undefined") ? data : _.where(data, actionsSet[action].filter);
			if (typeof action !== "undefined") {
				if (typeof sets !== "undefined") {
					$.each(sets, function (idx, set) {
						// Select active set
						var setAction = _.findKey(actionsSet, { url: idx });
						var filterSet = (typeof actionsSet[setAction].filter === "undefined") ? set : _.where(set, actionsSet[setAction].filter);
						if (setAction === action) { selected = filterSet; }
						// Refresh count badge for all action sets
						$('select>[value="' + setAction + '"]', $selectActivePanel).html((actionsSet[setAction]?.badgeLabel || setAction) + ' (' + filterSet.length + ')');
						$('[data-action="'  + setAction + '"]', $selectActivePanel).html((actionsSet[setAction]?.badgeLabel || setAction) + ' <span class="badge label-success">' + filterSet.length + '</span>');
					});
				}
				// Refresh count badge for current action set
				$('select>[value="' + action + '"]', $selectActivePanel).html((actionsSet[action]?.badgeLabel || action) + ' (' + selected.length + ')');
				$('[data-action="'  + action + '"]', $selectActivePanel).html((actionsSet[action]?.badgeLabel || action) + ' <span class="badge label-success">' + selected.length + '</span>');
				// Change texts specific to current action set
				$(".val-title", ".bottom-controls"       ).text(actionsSet[action]?.pagLabel   || action);
				$(".val-title", ".nppaginatedcells-empty").text(actionsSet[action]?.emptyLabel || action);
				$(".top-controls .search-container").attr("data-original-title", "Search " + (actionsSet[action]?.emptyLabel || action));
			}
			return selected;
		};
        window.panelComp = $("#panel-nodes").npPaginatedCells({
            headerUser: taoUserProfile.username,
            url       : urls,
            viewMode  : preferences.viewMode,
            order     : [
                { "label": "Name ascending" , "objAttributeName": "fullName", "direction": "ASC" },
                { "label": "Name descending", "objAttributeName": "fullName", "direction": "DSC" }
            ],
            filterAttribute: "fullName",
            doDataPreprocessing: function (data, sets) {
                var activeSet = getActiveSet(data, sets);
				var action = $('[data-toggle="tab"][aria-expanded="true"]', $selectActivePanel).data("action");
				$.each(activeSet, function (index, elX) {
					// Additional cell info
					elX.fullName      = elX.firstName + " " + elX.lastName;
					elX.labelGroups   = _.map(elX.groups, function(g) { return g["name"]; }).join(", ");
					elX.ago           = niceIsoTime(elX.lastLoginDate);
					
					// Quotas
					elX.prettyCpuQuota        = elX.cpuQuota         === -1 ? "unmeterred" :               elX.cpuQuota              + " X";
					elX.prettyMemoryQuota     = elX.memoryQuota      === -1 ? "unmeterred" :               elX.memoryQuota           + " GB";
					elX.prettyInputQuota      = elX.inputQuota       === -1 ? "unmeterred" :               elX.inputQuota            + " GB";
					elX.prettyProcessingQuota = elX.processingQuota  === -1 ? "unmeterred" :               elX.processingQuota       + " GB";
					elX.usageInputQuota       = elX.inputQuota       === -1 ? ""           : ", using: " + elX.actualInputQuota      + " GB";
					elX.usageProcessingQuota  = elX.processingQuota  === -1 ? ""           : ", using: " + elX.actualProcessingQuota + " GB";
				});
				return activeSet;
            },
            doCustomRender: function($elClone, elX){
				// User gravatar
				var iconHtml = $(".box-icon", $elClone).html();
				$(".box-icon", $elClone).html('<img src="https://www.gravatar.com/avatar/' + CryptoJS.MD5(elX.email).toString() + '?d=mp&s=160" />');
				$(".val-email", $elClone).attr("title", elX.email);
				
				// Check image validity and its layout (portrait/landscape)
				var img = $(".box-icon>img", $elClone).get(0);
				img.decode().then(function () {
					$(img).parent().addClass("logo inline");
					(img.naturalWidth < img.naturalHeight) && $(img).addClass("portrait");
				}).catch(function () {
					$(".box-icon", $elClone).html(iconHtml); // Restore default icon when image is not valid
				});
				
				
				// Set action buttons availabilities
				var action = $('[data-toggle="tab"][aria-expanded="true"]', $selectActivePanel).data("action");
				(action === "disabled_users") && $elClone.addClass("disabled");
				(action === "pending_users" ) && $elClone.addClass("disabled");
				(action !== "active_users"   || taoUserProfile.userRole !== "ADMIN") && $('[data-action="disable"  ]', $elClone).addClass("hidden");
				(action !== "disabled_users" || taoUserProfile.userRole !== "ADMIN") && $('[data-action="enable"   ]', $elClone).addClass("hidden");
				(action !== "active_users"   || taoUserProfile.userRole !== "ADMIN") && $('[data-action="resources"]', $elClone).addClass("hidden");
            },
            doAction: function (action, args) {
				var dna = $.extend({}, args?.dna || {});
				switch (action) {
					// Add user			------------------------------------------
					case "op-plus":		myModalNodesOpShow(action, dna);
										break;
					// Edit user		------------------------------------------
					case "edit":		myModalNodesOpShow(action, dna);
										break;
					// Edit resources	------------------------------------------
					case "resources":	myModalNodesOpShow(action, dna);
										break;
					// Manage status	------------------------------------------
					case "enable":
					case "disable":
					case "delete":		$("#confirm-dialog").modal("confirm", {
											msg: 'Are you sure you want to ' + action + ' user: <strong>' + dna.fullName + '</strong>?',
											callbackConfirm: function () { manageUser(action, dna); }
										});
										break;
				}
            }
        });
		
		$selectActivePanel
		// Change active tab (using the tab controls)
		.on("click", '[data-toggle="tab"][aria-expanded="false"]', function (e) {
			navCleanup();
			
			var action = $(this).data("action");
			e.originalEvent && $("select", e.delegateTarget).val(action);
			
			urls = (urls.length == 0) ? $.map(actionsSet, function (set, idx) { return set.url; }) : [ actionsSet[action].url ];
			window.panelComp.refreshData(urls);
		})
		// Change active tab (using the combobox)
		.on("change", "select", function (e) {
			$('[data-toggle="tab"][data-action="' + this.value + '"]', e.delegateTraget).eq(0).click();
		})
		// Manage content when active tab changes
		.on("shown.bs.tab", '[data-toggle="tab"][aria-expanded]', function (e) {
			// Toggle visibility of specific toolbar icons
			$('[data-showwhen]', ".top-controls").addClass("hidden").filter('[data-showwhen="' + $(e.currentTarget).data("action") + '"]').removeClass("hidden");
			taoUserProfile.userRole !== "ADMIN" && $('[data-action="op-plus"]', ".top-controls").remove();
		});
		
		// Start with active toolbox containers
		$('[data-toggle="tab"][data-action="active_users"]', $selectActivePanel).eq(0).click();
	});
	
//# sourceURL=users-admin2.fragment.js
</script>
