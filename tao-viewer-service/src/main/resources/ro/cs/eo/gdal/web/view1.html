<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'/>
    <title></title>
    <link rel="stylesheet" href="https://cdn.rawgit.com/openlayers/openlayers.github.io/master/en/v6.4.3/css/ol.css"
          type="text/css">
    <script src="https://cdn.rawgit.com/openlayers/openlayers.github.io/master/en/v6.4.3/build/ol.js"></script>
    <style>
    .map {
      width: 100%;
      height: 800px;
    }
    </style>
</head>

<body>
<div id="map" class="map"></div>

<script>
    var urlParams = new URLSearchParams(window.location.search);
    var name = urlParams.get('name');
    function buildMap()
    {
        var res=this.responseText;
        var imageProps=JSON.parse(res)
        var layers = [
          new ol.layer.Tile({
            source: new ol.source.OSM(),
          }),
          new ol.layer.Tile({
              source: new ol.source.XYZ({
                  url: '/products/view/tile/?name='+name+'&z={z}&x={x}&y={-y}',
                  minZoom: imageProps.tile_grid.min_zoom,
                  maxZoom: imageProps.tile_grid.max_zoom
              })
          })
        ];
        var view = new ol.View({
          center: imageProps.center,
          zoom: 9
        });
        var map = new ol.Map({
          layers: layers,
          target: 'map',
          view: view
        });
        centerOnCurrentUserLocation(view);
    }
    function centerOnCurrentUserLocation(view) {
        if (!window.navigator || !navigator.geolocation) {
            return;
        }
        var centerView = function (position) {
            if (position) {
                view.setCenter(ol.proj.fromLonLat([position.longitude, position.latitude]));
            }
        };
        try {
            var cachedPosition = JSON.parse(sessionStorage.getItem("tao.userLocation") || "null");
            if (cachedPosition && isFinite(cachedPosition.latitude) && isFinite(cachedPosition.longitude)) {
                centerView(cachedPosition);
                return;
            }
        } catch (ignored) { }
        navigator.geolocation.getCurrentPosition(
            function (position) {
                var userLocation = {
                    latitude: position.coords.latitude,
                    longitude: position.coords.longitude
                };
                try { sessionStorage.setItem("tao.userLocation", JSON.stringify(userLocation)); } catch (ignored) { }
                centerView(userLocation);
            },
            function () { },
            { enableHighAccuracy: false, timeout: 5000, maximumAge: 600000 }
        );
    }
    function httpGet(theUrl)
    {
        var getReq = new XMLHttpRequest();
        getReq.onload=buildMap
        getReq.open( "GET", theUrl );
        getReq.send();
    }

    httpGet('/products/view/info/?name='+name);


</script>
</body>

</html>
