<script type="text/javascript">
	$(document).ready(function () {
		// Prevent keyup to bubble outside the propbar and trigger events
		$("app-modal")
			.on("keyup", function (e) {
				event.stopPropagation();
			})
			.on("click", ".pni-editable-btn", function (e) {
				var $parent = $(this).parent();
				var $input = $('input',$parent);
				var $span = $('span', $parent);
				$parent.addClass("edit");
				$input.focus();
				$input.val($span.text());
			})
			.on("keyup", ".pni-editable-input", function (e) {
				if (e.keyCode && (e.keyCode === 13)) {
					$(this).trigger("blur");
				}
			});
		
		// Save node name and exit edit mode
		$(".pni-editable-input")
			.on("blur", function (e) {
				var $parent = $(this).parent();
				var $input = $('input', $parent);
				var $span = $('span', $parent);
				$span.text($input.val());
				$parent.removeClass("edit");
			});
	});
	
//# sourceURL=propbar.content.js
</script>
