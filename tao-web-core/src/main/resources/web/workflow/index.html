<script type="text/javascript">
	var myParent = window.parent;
	
	function refreshSettingsWorkflow() {
		// Size
		$("body").removeClass(function (index, className) { return (className.match(/\bsize-\S+/g) || []).join(' '); }).addClass(myParent.selectedSize);
		// Color
		$("body").removeClass(function (index, className) { return (className.match(/\bskin-\S+/g) || []).join(' '); }).addClass("skin-" + myParent.selectedStyle.scheme).addClass("skin-" + myParent.selectedStyle.scheme + "-" + myParent.selectedStyle.color);
		$("#root_wf_css_file").attr("href", "./css/root/" + myParent.selectedStyle.scheme + "/" + myParent.selectedStyle.css);
		setTimeout(function () {
			$("#toolboxSidebar .toolboxAccordion").data("uiAccordion") && $("#toolboxSidebar .toolboxAccordion").accordion("refresh");
		}, 1500);
	}
	
	$(document).ready(function () { 
		refreshSettingsWorkflow();
		
		myParent.$(myParent.document).on("settings-change", function (e, args) {
		   refreshSettingsWorkflow();
		});
		
		$("#inputSequencingArg").on("change", function (e) {
			if ($(this).val() === "0") {
				$(this).addClass("empty").val("");
			} else {
				$(this).removeClass("empty");
			}
		});
		$("#inputSequencingArg+.side-control").on("click", function (e) {
			$(this).prev().addClass("empty").val("");
		});
		
		$('div[rel="timeline-tooltip"]').tooltip({ container: "body" });
		
		$("#toolboxSidebar").on("ready", function (e) {
			$('[aria-controls="QUERIES"]', e.delegateTarget).removeClass("hidden");
		});
	 });
</script>
