<div class="modal-content" id="showDryRunResults">
    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span><span class="sr-only">Close</span></button>
		<h4 class="modal-title">Dry Run Results<small> The outputs of the <strong>dry run results.</strong></small></h4>
    </div>
    <div class="modal-body">
        <section>
            <div >
				<div class="box">
					<div class="box-body table-responsive no-padding box-shadow--6dp">
						<table class="table table-bordered box-shadow--6dp tbl-edt" id="view-metrics">
							<thead>
								<tr>
									<th>Component Name</th>
									<th>Duration</th>
									<th>CPU Metrics</th>
									<th>Memory Metrics</th>
								</tr>
							</thead>
							<tbody class="tpl-sample-body">
								<tr class="tpl-sample-row">
									<td>
										<div class="var-name"></div>
									</td>
									<td>
										<div class="var-duration"></div>
									</td>
									<td><div rows="2" class="var-cpu"></div></td>
									<td>
										<div rows="2" class="var-memory"></div>
									</td>
									
								</tr>
							</tbody>
						</table>
					</div>
				</div>
            </div>
        </section>
        
    </div>
	<div class="modal-footer">
		<button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
	</div>
</div><!-- /.modal-content -->
<style>

</style>

<script>

function getComponentsIdList(workflowId){
	var componentList = {
		id: [],
		name: []
	};
	$.ajax({
      async: false,
			cache: false,
            type: "get",
            url: baseRestApiURL + "workflow/"+workflowId+"/",
            dataType: "json",
            contentType: "application/json; charset=utf-8",
            headers: {
                "Accept": "application/json",
                "Content-Type": "application/json",
                "X-Auth-Token": window.tokenKey
            },
            error : function (jqXHR, textStatus, errorThrown) {
                if( jqXHR.status === 500 ){
                    alert('E001, Exec node no longer found.');
                } else {
                    alert('E001, An error has occurred, please try again or contact app admin.');
                }
            },
            success: function(r) {
				
                var response = chkTSRF(r);
				
				$.each(response.nodes, function(i, node){
					componentList.id.push(node.componentId);
					componentList.name.push(node.name);
				});
			}
	});
	return componentList;
}

function getDryRunResults(compIdList){
	var results = [];
	$.ajax({
            async: false,
			cache: false,
            type: "get",
            url: baseRestApiURL + "simpipe/metrics?id="+compIdList,
            dataType: "json",
            contentType: "application/json; charset=utf-8",
            headers: {
                "Accept": "application/json",
                "Content-Type": "application/json",
                "X-Auth-Token": window.tokenKey
            },
            error : function (jqXHR, textStatus, errorThrown) {
                if( jqXHR.status === 500 ){
                    alert('E001, Exec node no longer found.');
                } else {
                    alert('E001, An error has occurred, please try again or contact app admin.');
                }
            },
            success: function(r) {
				
                results = chkTSRF(r);

			}
	});
	return results ;

}

function displayMetrics(metrics, componentName) {
	if(metrics.length > 0){
		$.each(metrics, function(i, metric){
			var $el = $("#view-metrics").find(".tpl-sample-body").clone().removeClass("tpl-sample-body");
			var $sRow = $el.find(".tpl-sample-row").addClass("val-row").removeClass("tpl-sample-row");

			$('.var-name', $el).text(componentName[i]);
			$('.var-cpu', $el).text(metric.cpuMetrics);
			$('.var-memory', $el).text(metric.memoryMetrics);
			$('.var-duration', $el).text(metric.duration);
			$("#view-metrics").append($el);
		});
	} else {
		var $el = $("#view-metrics").find(".tpl-sample-body").clone().removeClass("tpl-sample-body");
		var $sRow = $el.find(".tpl-sample-row");
		var element = $('<tr><th colspan="5" class="warning">No dry run results to display</th></tr>');
		$el.append(element);
		$("#view-metrics").append($el);
	}
	
	
}

$(document).ready( function() {
	// Get executions results for selected workflow
	var currentWfID = window.userOpStack[0].dna.id;
	//getWorkflowResults(currentWfID);
	var compList = getComponentsIdList(currentWfID);
	var drResults = getDryRunResults(compList.id.join(","));
	displayMetrics(drResults, compList.name);

});

//# sourceURL=workflow-show-results.js
</script>
