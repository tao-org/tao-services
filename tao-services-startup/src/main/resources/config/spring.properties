spring.application.name=tao-services

####################
## Logging levels ##
####################
logging.level.root=ERROR
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR
logging.level.org.xnio=ERROR
logging.level.io.undertow=ERROR
logging.level.com.mchange=ERROR
logging.level.net.sf.ehcache=ERROR
logging.level.org.reflections.Reflections=ERROR
logging.level.ro.cs.tao=DEBUG
logging.level.ro.cs.tao.services.security=INFO
logging.file.name=../logs/${spring.application.name}.log
logging.pattern.console=%white(%d{yyyy-MM-dd HH:mm:ss}) %highlight(%-5level) [%-10thread] %logger{16}: %msg%n%throwable
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger: %msg%n
logging.logback.rollingpolicy.file-name-pattern=./logs/${spring.application.name}-%d{yyyyMMdd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=10

#######################
## Servlet container ##
#######################
banner.location=classpath:banner.txt
#spring.session.store-type=hash_map
server.url=https://localhost
spring.main.allow-bean-definition-overriding=true
spring.session.store-type=NONE
security.enable-csrf=false
server.connection-timeout=60s
server.servlet.session.timeout=60m
spring.servlet.multipart.location=/mnt/tao/tmp
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
server.http2.enabled=true
endpoints.health.sensitive = false
spring.jackson.deserialization.accept-float-as-int=false

##########################
## Spring Boot Actuator ##
##########################
management.endpoints.enabled-by-default=true
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=auditevents,health,restart,info,loggers,metrics,sessions,prometheus
management.endpoint.restart.enabled=true
management.health.defaults.enabled=false
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.ping.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
spring.autoconfigure.exclude=org.springframework.boot.micrometer.metrics.autoconfigure.logging.log4j2.Log4J2MetricsAutoConfiguration


################
## Scheduling ##
################
spring.quartz.job-store-type = jdbc
spring.quartz.jdbc.initialize-schema = never
spring.quartz.properties.org.quartz.scheduler.instanceName = tao-scheduler
spring.quartz.properties.org.quartz.threadPool.class = org.quartz.simpl.SimpleThreadPool
spring.quartz.properties.org.quartz.threadPool.threadCount = 4
spring.quartz.properties.org.quartz.jobStore.class = org.quartz.impl.jdbcjobstore.JobStoreTX
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass = org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
spring.quartz.properties.org.quartz.jobStore.tablePrefix = scheduling.qrtz_

#######################
## API Documentation ##
#######################
springdoc.swagger-ui.path=/docs/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.docExpansion=none
springdoc.swagger-ui.syntaxHighlight.theme=monokai
springdoc.api-docs.path=/docs/api
springdoc.paths-to-match=/**,/**/**,/**/**/**
springdoc.model-and-view-allowed=true
springdoc.packagesToScan=ro.cs.tao.services

###################
## LLM Providers ##
###################
llm.provider=mistral

# Jlama Configuration

# GPULlama3 (Ollama) Configuration
gpullama3.base.url=http://localhost:11434
gpullama3.model.name=llama3
gpullama3.selection.file=data/gpullama3-selected-model.txt
gpullama3.prompt.system=
gpullama3.max.tokens=200
gpullama3.temperature=0.7
gpullama3.timeout.seconds=300

# Spring AI Mistral Configuration

# RAG Configuration
rag.documents.path=/mnt/tao/documents
rag.vector.store.path=/mnt/tao/vector-store/vector-store.json
rag.max.results=3
rag.min.score=0.7
rag.qdrant.host=localhost
rag.qdrant.grpc.port=6334
rag.qdrant.http.port=6333
rag.qdrant.collection=tao
rag.qdrant.use.tls=false
rag.qdrant.api.key=
rag.qdrant.request.timeout.seconds=15
rag.qdrant.runtime.fallback.enabled=true
rag.qdrant.auto.start.with.docker=true
rag.qdrant.docker.pull.on.start=true
rag.qdrant.docker.image=qdrant/qdrant:latest
rag.qdrant.docker.container.name=tao-qdrant
rag.qdrant.docker.command=docker
rag.qdrant.docker.startup.timeout.seconds=90
rag.qdrant.docker.data.path=/mnt/tao/qdrant-storage

