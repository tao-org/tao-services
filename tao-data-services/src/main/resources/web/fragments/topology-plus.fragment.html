<script type="text/javascript">
	var action        = window.userOpStack?.action || "edit";
	var initData      = $.extend({}, window.userOpStack?.dna || { id: "foo" });
    var $myModalNodes = $("#myModalNodes");
	
	// Get TAO flavors
	var getFlavors = $.ajax({
		cache  : false,
		url    : baseRestApiURL + "topology/flavors",
		type   : "GET",
		headers: {
			"Accept"      : "application/json",
			"Content-Type": "application/json",
			"X-Auth-Token": window.tokenKey
		}
	});
    
	// Get active users
    var getUsers = $.ajax({
		cache   : false,
		url     : baseRestApiURL + "admin/users?status=ACTIVE",
		dataType: "json",
		type    : "GET",
		headers : {
			"Accept"      : "application/json",
			"Content-Type": "application/json",
			"X-Auth-Token": window.tokenKey
		}
	});
	
	// Get current execution node
	var getNode = $.ajax({
		cache      : false,
		url        : baseRestApiURL + "topology/" + initData.id,
		type       : "GET",
		dataType   : "json",
		headers: {
			"Accept"      : "application/json",
			"Content-Type": "application/json",
			"X-Auth-Token": window.tokenKey
		}
	});
	
	// Get OpenStack availability
	var openStackAvailable = $.ajax({
		cache   : false,
		url     : baseRestApiURL + "topology/external",
		type    : "GET",
		dataType: "json",
		headers: {
			"Accept"      : "application/json",
			"Content-Type": "application/json",
			"X-Auth-Token": window.tokenKey
		}
	});
	
    // Show flavors selection
	function showFlavorsSelection($form, flavorID) {
        var $sel = $("#inputFlavor"   , $form).empty().hide();
		var $msg = $("#inputFlavorMsg", $form).empty().hide();
		
		if (action === "edit") {
			$("input.flavor-edit", $form).prop({ "disabled": true, "readonly": true });
			
			var flavor = (flavorID === "master") ? { id: "master", cpu: 1, memory: 1, disk: 1, swap: 1 } : _.find(window.taoFlavors, { id: flavorID });
			if (flavor) {
				$sel.append($(`<option value="${flavor.id}" selected>${flavor.id}</option>`).data("payload", flavor));
				$sel.npMultilineSelect();
				$sel.npMultilineSelect("disable");
				$sel.npMultilineSelect("refresh");
				$sel.npMultilineSelect("menuWidget").addClass("overflow-npmultilineselect").parent().css("z-index", "9999");
			} else {
				$msg.html('<input type="text" class="form-control" placeholder="Flavor service unavailable" disabled />').show();
			}
		} else {
			if (taoFlavors.length > 0 && $('[name="inputType"]:checked', $form).val() === "openstack") {
				$sel.append($('<option class="selected" value="" selected>Choose a flavor...</option>').data("payload", { id: null, placeholder: "Choose a flavor..." }));
				$.each(taoFlavors, function () {
					$sel.append($(`<option value="${this.id}">${this.id}</option>`).data("payload", this));
				});
				$sel.npMultilineSelect({
					select: function (e) {
						$("option", $sel).removeClass("selected").filter(":selected").addClass("selected");
					}
				});
				$sel.npMultilineSelect("refresh");
				$sel.npMultilineSelect("menuWidget").addClass("overflow-npmultilineselect").parent().css("z-index", "9999");
				$sel.show();
				
				$("input.flavor-edit", $form).val("").prop({ "disabled": false, "readonly": true });
				$sel.on("selectmenuchange", function (event, ui) {
					var payload = ui.item.element.data("payload");
					$sel.valid();
					$('[name="inputProcessorcount"]', $form).val(typeof payload?.cpu    === "undefined" ? "" : payload.cpu   ).valid();
					$('[name="inputMemorysize"    ]', $form).val(typeof payload?.memory === "undefined" ? "" : payload.memory).valid();
					$('[name="inputDiskspacesize" ]', $form).val(typeof payload?.disk   === "undefined" ? "" : payload.disk  ).valid();
					$('[name="inputSwapspacesize" ]', $form).val(typeof payload?.swap   === "undefined" ? "" : payload.swap  ).valid();
				});
			} else {
				if (typeof $sel.data("ui-npMultilineSelect") !== "undefined") { $sel.npMultilineSelect("destroy"); }
				$sel.empty().hide();
				$msg.html('<input type="text" class="form-control" placeholder="Flavor service unavailable" disabled />').show();
				$("input.flavor-edit", $form).val(0).prop({ "disabled": false, "readonly": false });
			}
        }
    }
	
	// Initialize form
	function initializeForm($form) {
		$.when(getUsers, getNode, getFlavors, openStackAvailable).done(function (getUsersResponse, getNodeResponse, getFlavorsResponse, openStackAvailableResponse) {
			$(".loading", $form).remove();
			// Active users
			var $owner = $('[name="associatedUser"]', $form);
			var allUsers = chkTSRF(getUsersResponse[0]);
			allUsers.sort(function name(a, b) { return a.lastName < b.lastName? -1: (a.lastName > b.lastName)? 1 : 0; });
			$owner.html('<option class="default" selected>Select node owner</option>');
			$.each(allUsers, function (idx, user) {
				var $option = $(`<option value="${user.id}">${user.lastName} ${user.firstName}</option>`);
				(user.username === "admin") && $option.addClass("administratorAccount");
				$owner.append($option);
			});
			
			// Host
			var host = chkTSRF(getNodeResponse[0]);
			$('[name="inputHostname"      ]', $form).val(host?.id             || "");
			$('[name="inputUsername"      ]', $form).val(host?.userName       || "");
			$('[name="inputPassword"      ]', $form).val(host?.userPass       || "");
			$('[name="inputSSHKey"        ]', $form).val(host?.sshKey         || "");
			$('[name="inputProcessorcount"]', $form).val(typeof host?.flavor?.cpu    === "undefined" ? 1 : host.flavor.cpu   );
			$('[name="inputMemorysize"    ]', $form).val(typeof host?.flavor?.memory === "undefined" ? 1 : host.flavor.memory);
			$('[name="inputDiskspacesize" ]', $form).val(typeof host?.flavor?.disk   === "undefined" ? 1 : host.flavor.disk  );
			$('[name="inputSwapspacesize" ]', $form).val(typeof host?.flavor?.swap   === "undefined" ? 0 : host.flavor.swap  );
			$('[name="inputDescription"   ]', $form).val(host?.description    || "");
			$('[name="inputActive"        ]', $form).val(host?.active ? "true" : "false");
			
			// Flavors
			window.taoFlavors = getFlavorsResponse[0].status === responseStatus.success ? getFlavorsResponse[0].data : [];
			showFlavorsSelection($form, host?.flavor?.id);
			
			// Tags
			initializeTagsInputAutocomplete("#formTags", "topology");
			
			// Action specific settings
			if (action === "edit") {
				$("#myModalLabel").html("Edit execution node");
				$("#btnSave"     ).html("Save changes");
				$("#reset"       ).html('<span>Reset changes&nbsp;&nbsp;<i class="fa fa-refresh"></i></span>');
				$('[name="inputHostname"]+.form-control-info', $form).addClass("hidden");
				$('[name="inputHostname"      ]', $form).attr("disabled", "disabled");
				$('[name="inputProcessorcount"]', $form).attr("disabled", "disabled");
				$('[name="inputMemorysize"    ]', $form).attr("disabled", "disabled");
				$('[name="inputDiskspacesize" ]', $form).attr("disabled", "disabled");
				$('[name="inputSwapspacesize" ]', $form).attr("disabled", "disabled");
				
				(host?.tags && host.tags !== "") &&  $("#formTags").importTags(host.tags.join());
				(host?.owner) && $owner.val(host.owner);
				(host?.flavor?.id === "master") && $owner.addClass("master").attr("disabled", "disabled");
			} else {
				$('[name="inputType"]', $form).closest(".node-type").removeClass("hidden");
				$owner.closest(".form-group").addClass("hidden");
				var osAvailable = openStackAvailableResponse[0].status === responseStatus.success && openStackAvailableResponse[0].data;
				$('[name="inputType"][value="openstack"]', $form).prop("disabled", !osAvailable);
				
			}
		}).fail(function (jqXHR, textStatus, errorThrown) {
			$(".loading", $form).remove();
			showMsg(errorThrown, "ERROR");
		});
	}
	
	// Check unique values for hostname
	function checkUnique(validator, value, element) {
		var previous = validator.previousValue(element);
		if (previous.old === value) { return previous.valid; }
		previous.old = value;
		validator.startRequest(element);
		$.ajax({
			cache      : false,
			type       : "get",
			url        : baseRestApiURL + "topology/" + value,
			dataType   : "json",
			contentType: "application/json; charset=utf-8",
			headers    : {
				"Accept"      : "application/json",
				"Content-Type": "application/json",
				"X-Auth-Token": window.tokenKey
			},
			error: function (jqXHR, textStatus, errorThrown) {
				$(element).attr("server-down", "true");
				var errors = {};
				errors[element.name] = validator.defaultMessage(element, "isUnique");
				validator.invalid[element.name] = true;
				validator.showErrors(errors);
				previous.valid = false;
				validator.stopRequest(element, false);
			},
			success: function (response) {
				$(element).removeAttr("server-down");
				var isValid = false;
				var nodes = [ chkTSRF(response) ];
				if ($.isArray(nodes)) {
					var searchBy  = element.name;
					var searchFor = element.value.trim().toLowerCase();
					switch (element.name) {
						case "inputHostname": searchBy = "id"; break;
					}
					// Element is valid when it's value is not found in the database
					isValid = (_.where(nodes, { [searchBy]: element.value.trim().toLowerCase() }).length === 0);
					// Element is valid when it matches its initial value (edit action)
					!isValid && (action === "edit" && initData[searchBy] === searchFor) && (isValid = true);
				}
				if (true === isValid) {
					var submitted = validator.formSubmitted;
					validator.prepareElement(element);
					validator.formSubmitted = submitted;
					validator.successList.push(element);
					delete validator.invalid[element.name];
					validator.showErrors();
				} else {
					var errors = {};
					errors[element.name] = validator.defaultMessage(element, "isUnique");
					validator.invalid[element.name] = true;
					validator.showErrors(errors);
				}
				previous.valid = isValid;
				validator.stopRequest(element, isValid);
			}
		});
		return "pending";
	}
	
	// Save execution node
    function saveNode($form) {
		var flavorId = (action === "edit") ? $('[name="inputFlavor"]', $form).val() : ($('[name="inputFlavor"]>option:selected', $form).length ? $('[name="inputFlavor"]', $form).val() : $('[name="inputHostname"]', $form).val().toLowerCase());
		var tags     = (action === "edit") ? $('[name="formTags"   ]', $form).val() : $("[name=inputType ]", $form).val();
		var formData = {
			"id"            : $('[name="inputHostname"   ]', $form).val().toLowerCase(),
			"userName"      : $('[name="inputUsername"   ]', $form).val(),
			"userPass"      : $('[name="inputPassword"   ]', $form).val() !== "" ? $('[name="inputPassword"]', $form).val() : "",
			"sshKey"        : $('[name="inputSSHKey"     ]', $form).val() !== "" ? $('[name="inputSSHKey"  ]', $form).val() : null,
			"description"   : $('[name="inputDescription"]', $form).val(),
			"active"        : $('[name="inputActive"     ]', $form).val() === "true",
			"tags"          : tags.split(","),
			"owner"         : $('[name="associatedUser"  ]', $form).val() !== "Select node owner" ? $('[name="associatedUser"]', $form).val() : ($('[name="associatedUser"].master', $form).length ? null : ""),
			"flavor"        : {
				"id"        : flavorId,
				"cpu"       : parseInt  ($('[name="inputProcessorcount"]', $form).val()),
				"memory"    : parseInt  ($('[name="inputMemorysize"    ]', $form).val()),
				"disk"      : parseFloat($('[name="inputDiskspacesize" ]', $form).val()),
				"swap"      : parseFloat($('[name="inputSwapspacesize" ]', $form).val()),
				"rxtxFactor": 1.0
			},
			"volatile"      : false
		};
		$.ajax({
			cache   : false,
			url     : baseRestApiURL + "topology/" + formData.id,
			type    : action === "edit" ? "PUT" : "POST",
			dataType: "json",
			data    : JSON.stringify(formData),
			headers : {
				"Accept"      : "application/json",
				"Content-Type": "application/json",
				"X-Auth-Token": window.tokenKey
			},
			error: function (jqXHR, textStatus, errorThrown) {
				if (jqXHR.status === 500 ){
					showMsg("Error " + (action === "edit" ? "updating" : "adding") + " execution node. Please check your data and try again.", "ERROR");
				} else if (jqXHR.status === 400 || jqXHR.status === 406) {
					showMsg("Error " + (action === "edit" ? "updating" : "adding") + " execution node. Please check your data, one or more values for the attributes was not in the acceptable range.", "ERROR");
				} else {
					showMsg("Unknown status error [" + textStatus + "]. Please check your data and try again.", "ERROR");
				}
			},
			success: function(response, textStatus, jqXHR) {
				if (response.status === window.responseStatus.success) {
					showMsg("Execution node successfully " + (action === "edit" ? "updated" : "added") + ".", "SUCCESS");
					$myModalNodes.modal("hide");
					panelComp.refreshData();
				} else {
					showMsg(response.message, "ERROR");
				}
            }
        });
    }
	
    $(document).ready(function () {
        var $form = $("#frmExecNodeEdit");
		$("#myModalLoading svg").clone().appendTo(".loading", $form);
		
		// Initialize form
		initializeForm($form);
		
		// Show flavors selection
		$('[name="inputType"]', $form).on("change", function (e) {
			showFlavorsSelection($form);
		});
		
		// Form events
		$form
		// Disable form submit on keypress (Enter)
		.on("keyup keypress", ".form-control", function (e) {
			if ((e.keyCode || e.which) === 13) {
				e.preventDefault();
				return false;
			}
		})
		// Disable default form submit (replaced by the validator submit handler)
		.on("submit", function (event) {
			event.preventDefault();
			return false;
		});
		
		$.validator.addMethod("isAlpha", function (value, element) {
			return this.optional(element) || /^([A-Za-z0-9]|\.|-|_)+$/.test(value);
		}, "This field contains characters that are not allowed.");
		
		// Redefine validator field events (keyup, focusout, ...)
		$.validator.setDefaults({
			// Redefine keyup functionality for inputs that require remote validations (isUnique rule is on)
			onkeyup: function () {
				var originalKeyUp = $.validator.defaults.onkeyup;
				var customKeyUp = function (element, event) {
					var validator = $form.data("validator");
					if (validator?.settings?.rules[element.name]?.isUnique === true && typeof validator?.invalid[element.name] === "undefined") {
						return false;
					} else {
						return originalKeyUp.call(this, element, event);
					}
				}
				return customKeyUp;
			}(),
			// Redefine focusout functionality for inputs that affect the validity of other
			onfocusout: function () {
				var originalFocusOut = $.validator.defaults.onfocusout;
				var customFocusOut = function (element, event) {
					if (element.name === "inputPassword") {
						$('[name="inputSSHKey"]', this.currentForm).removeData("previousValue").valid();
					} else if (element.name === "inputSSHKey") {
						$('[name="inputPassword"]', this.currentForm).removeData("previousValue").valid();
					}
					return originalFocusOut.call(this, element, event);
				}
				return customFocusOut;
			}()
		});
		
		// Custom validation for hostname (unique values)
		$.validator.addMethod('isUnique', function (value, element) {
			return checkUnique(this, value, element);
		}, function (params, element) {
			var message = "Value already in use";
				 if (typeof $(element).attr("server-down") !== "undefined") { message = "Server inaccessible. Can\'t verify value validity."; }
			else if (element.name.startsWith("inputHostname")) { message = "Hostname already in use"; }
			return message;
		});
		
		$.validator.addMethod("require_one", function (value, element, options) {
			var numberRequired = 1;
			var selector = options[0];
			// Look for the selector within the parent form
			var validOrNot = $(selector, element.form).filter(function () {
				 // Each field is kept if it has a value
				 return $(this).val() !== "";
				 // Set to true if there are enough, else to false
			}).length >= numberRequired;
			return validOrNot;
		}, function (params, element) {
			var message = "Please fill out at least one of the fields above.";
			switch (element?.name) {
				case "inputPassword":
				case "inputSSHKey"  : message = "Please fill out either the password or the SSH key."; break;
			}
			return message;
		});
		
		// Form validation rules
		var fValidator = $form.validate({
			rules: {
				inputHostname      : { required: true, isAlpha: true, isUnique: true },
				inputUsername      : { required: true },
				inputPassword      : { require_one: [ ".authPassKey" ] },
				sshKey             : { require_one: [ ".authPassKey" ] },
				inputProcessorcount: { min: 1 },
				inputMemorysize    : { min: 1 },
				inputDiskspacesize : { min: 1 },
				inputSwapspacesize : { min: 0 },
				inputFlavor        : { required: '[name="inputType"][value="openstack"]:checked' }
				
			},
			highlight: function (element, errorClass) {
				if ($(element).hasClass("authPassKey")) {
					$(element).closest(".form-group").addClass("has-error");
				} else {
					$(element).parent().addClass("has-error");
				}
			},
			unhighlight: function (element, errorClass) {
				if ($(element).hasClass("authPassKey")) {
					$(element).closest(".form-group").removeClass("has-error");
				} else {
					$(element).parent().removeClass("has-error");
				}
			},
			messages: { },
			errorPlacement: function (error, element) {
				if (element.hasClass("authPassKey")) {
					error.appendTo($("#inputSSHKey").parent());
				} else {
					error.appendTo(element.parent());
				}
			},
			success: function (label) {
				label.remove();
			},
			submitHandler: function (form) {
				saveNode($form);
				return false;
			},
			invalidHandler: function (event, validator) { }
		});
    });
