<style>
	/*------FORM------*/
	#frmContainer {
		.tagsinput .tag              {width:100%;margin-right:0;
			&.match                  {background:var(--status-success);}
			&.error                  {background:var(--status-danger);}
			&:not(.error):hover      {cursor:pointer;box-shadow:0 0.22em 1.1em rgb(0 0 0/.25);}
			&:not(.error):active     {box-shadow:inset 0 0.22em 0.35em rgb(0 0 0/.2);}
			&:has(.tag-remove:hover) {box-shadow:none;}
			.tag-text                {max-width:5em;}
			&~div>.tag-input         {display:none;}
		}
		
		.control-label              {text-align:inherit;margin-bottom:5px;}
		.info-label                 {font-weight:400;font-style:italic;margin:-2px 0;}
		[name=footprint][readonly]  {color:#ccc;padding-top:0;padding-bottom:0;word-break:break-all;resize:none;}
		[name=description]          {resize:none;}
		[name=btnSave]              {float:left ;width:70%;min-width:fit-content;}
		[name=btnCancel]            {float:right;width:28%;min-width:fit-content;}
		#reset                      {background:none;border:0;opacity:0.8;font-size:1.2em;color:var(--status-info);float:right;}
		#reset i                    {vertical-align:middle;}
		.scroll-into-view,.focus-on {opacity:0.6;font-weight:700;}
		#reset:hover,.scroll-into-view:hover,.focus-on:hover,
		#reset:focus,.scroll-into-view:focus,.focus-on:focus {opacity:1;}
		@media (min-width:768px) {& {margin-right:-15px;}}
	}
	
	/*------MAP------*/
	#mapExtent {
		position:relative;display:block;min-height:40em;
		.map {border:1px solid rgb(0 0 0/.2);border-radius:5px;box-shadow:1px 1px 3px 0 rgb(0 0 0/.2);overflow:hidden;}
		.poly-actions-panel {
			width:50rem;max-width:100%;border:0;
			textarea {font-size:0.8em;line-height:1;resize:none;}
			.btn-poly {color:rgb(255 255 255/0.8);&:hover {color:rgb(255 255 255/1);}&:disabled {color:rgb(255 255 255/0.4);pointer-events:none;}}
		}
		.sliderscontainer {display:none;}
		@media (max-width:767px) {& {min-height:90vh!important;max-height:90vh!important;margin-top:15px;}}
	}
</style>

<div class="modal-content">
	<div class="modal-header">
		<button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span><span class="sr-only">Close</span></button>
		<h4 id="myModalLabel" class="modal-title">Add new site</h4>
	</div>
	<div class="modal-body">
		<div class="row">
			<div class="col-sm-4 col-md-4">
				<!-- FORM -->
				<form id="frmContainer" class="form-horizontal clearfix" action="" role="form">
					<div class="row">
						<div class="col-sm-12 col-md-12">
							<div class="form-group">
								<label for="name" class="col-sm-12 col-md-12 control-label">Name</label>
								<div class="col-sm-12 col-md-12">
									<input id="name" type="text" class="form-control" name="name" placeholder="name" autocomplete="off" value="" />
								</div>
							</div>
						</div>
						<div class="col-sm-12 col-md-12">
							<div class="form-group">
								<label for="description" class="col-sm-12 col-md-12 control-label">Description</label>
								<div class="col-sm-12 col-md-12">
									<textarea id="description" class="form-control" rows="3" name="description" placeholder="description" autocomplete="off"></textarea>
								</div>
							</div>
						</div>
					</div>
					<div class="row">
						<label class="col-sm-12 col-md-12 group-label">Define your area of interest</label>
						<div class="col-sm-12 col-md-8">
							<div class="form-group">
								<label for="footprint" class="col-sm-12 col-md-12 control-label">Polygon<sup>*</sup></label>
								<div class="col-sm-12 col-md-12">
									<textarea id="footprint" class="form-control" rows="2" name="footprint" placeholder="polygon" tabindex="-1" autocomplete="off" readonly="true"></textarea>
								</div>
								<label class="col-sm-12 col-md-12 info-label">(*) draw on the <a class="scroll-into-view" href="#mapExtent">map</a> or select a <a class="focus-on" href="#tileTags_tag">tile</a></label>
							</div>
						</div>
						<div class="col-sm-12 col-md-4">
							<div class="form-group">
								<label for="tileTags" class="col-sm-12 col-md-12 control-label">Tile</label>
								<div class="col-sm-12 col-md-12">
									<input id="tileTags" class="form-control" type="text" name="tileTags" />
								</div>
							</div>
						</div>
					</div>
					<div class="row">
						<label class="col-sm-12 col-md-12 group-label">Choose your time period</label>
						<div class="col-sm-6 col-md-6">
							<div class="form-group">
								<label class="col-sm-12 col-md-12 control-label">Start date</label>
								<div class="col-sm-12 col-md-12">
									<input id="startDate" type="text" autocomplete="off" name="startDate" class="datepicker form-control" >
								</div>
							</div>
						</div>
						<div class="col-sm-6 col-md-6">
							<div class="form-group">
								<label class="col-sm-12 col-md-12 control-label">End date</label>
								<div class="col-sm-12 col-md-12">
									<input id="endDate" type="text" autocomplete="off" name="endDate" class="datepicker form-control" >
								</div>
							</div>
						</div>
					</div>
					<div class="row">
						<div class="col-sm-12 col-md-12">
							<div class="form-group">
								<div class="col-sm-12 col-md-12">
									<button id="reset" type="reset"><span>Reset&nbsp;&nbsp;<i class="fa fa-recycle"></i></span></button>
								</div>
							</div>
						</div>
					</div>
					<div class="modal-footer">
						<button id="btnSave"   type="submit" class="btn btn-flat btn-primary" name="btnSave">Add site</button>
						<button id="btnCancel" type="button" class="btn btn-flat btn-default" name="btnCancel" data-dismiss="modal">Cancel</button>
					</div>
				</form>
			</div>
			<!-- MAP -->
			<div class="col-sm-8 col-md-8">
				<div id="mapExtent" class="hidden"></div>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	var $myModalNodes = $("#myModalNodes");
	
	// Initialize datepicker controls for start/end dates
	function initializeDatepickerControls ($startDate, $endDate) {
		// Remove old datepickers
		$.datepicker.dpDiv.remove();
		
		// Set the mininum end date when start date changes
		var setMinEndDate = function () {
			var minEndDate = $startDate.datepicker("getDate");
			(minEndDate != null) && minEndDate.setDate(minEndDate.getDate() + 1);
			$endDate.datepicker("option", "minDate", minEndDate);
		};
		
		// Initialize startDate datepicker
		$startDate.data("datepicker") && $startDate.datepicker("destroy");
		$startDate.datepicker({
			dateFormat: "yy-mm-dd",
			onSelect: function (date, picker) {
				setMinEndDate();
				picker.settings["dateAlreadySet"] = true;
				$startDate.valid();
			},
			onClose: function (date, picker) {
				if (!picker.settings["dateAlreadySet"]) {
					var date = moment(date);
					picker.input.val(date.isValid() ? moment(date).format("YYYY-MM-DD") : "");
					setMinEndDate();
				}
				picker.settings["dateAlreadySet"] = false;
			}
		});
		
		// Initialize endDate datepicker
		$endDate.data("datepicker") && $endDate.datepicker("destroy");
		$endDate.datepicker({
			dateFormat: "yy-mm-dd",
			onSelect: function (date, picker) {
				picker.settings["dateAlreadySet"] = true;
				$endDate.valid();
			},
			onClose: function (date, picker) {
				if (!picker.settings["dateAlreadySet"]) {
					var date = moment(date);
					picker.input.val(date.isValid() ? moment(date).format("YYYY-MM-DD") : "");
					if (date.toDate() <= $("#startDate").datepicker("getDate")) {
						picker.input.val("");
					}
				}
				picker.settings["dateAlreadySet"] = false;
			}
		});
		
		// Initialize endDate min value
		if ($startDate.val() != "") { setMinEndDate(); }
		
		// Move datepickers to the current modal to automatically be destroyed when it's closed
		$.datepicker.dpDiv.appendTo($myModalNodes);
	}
	
	// Adjust the map size to match its container's boundaries
	function adjustMapSize(_map) {
		if (_map.mapActive) {
			var $container = _map.el.closest(".modal-dialog");
			var cTop = $container.offset().top;
			var cBtm = $container.outerHeight(true) - $container.height() - cTop;
			var marg = _map.el.offset().top + cBtm;
			
			var $form = $("form", $container);
			var minH = $form.length > 0 ? $form.height() - (_map.container.parent().outerHeight(true) - _map.container.parent().outerHeight()) : 550;
			
			_map.el.css({ "height": "calc(100vh - " + parseInt(marg + 0.5) + "px", "min-height": parseInt(minH + 0.5) + "px", "max-height": parseInt(minH + 0.5) + "px" });
			_map.updateMapSize(10);
		}
	}
	
	// Draw a polygon on the map and use it as the site's footprint
	function createPolygonOnMap(_map, footprint) {
		if (_map.mapActive) {
			_map.restartActiveInteraction();
			_map.userText.val(footprint);
			_map.btnParseUserText.get(0).click();
			if (!_map.userText.hasClass("error")) {
				return _map.userText.val();
			} else {
				_map.userText.focus();
				showMsg("Inconsistent footprint information for the selected tile", "WARNING");
			}
		}
		return false;
	};
	
	// Initialize tags control to accept Sentinel-2 tiles and use their geometry as site's footprint
	function initializeTileTags($tileTags, _map) {
		// If tags control already defined, remove old tags and exit
		if ($tileTags.data("tagsinputInit")) {
			$.each($("+.tagsinput .tag-remove", $tileTags), function () { this.click();});
			return false;
		}
		
		// Extract the footprint of a given Sentinel-2 tile
		var getTileFootprint = function (tileId) {
			var tileFootprint = $.Deferred();
			$.ajax({
				url: baseRestApiURL + "query/footprint",
				type: "GET",
				data: { satellite: "sentinel2", tile: tileId },
				beforeSend: function(xhr) { xhr.setRequestHeader("X-Auth-Token", tokenKey); },
				success: function(response) {
					if (response.status === "SUCCEEDED") {
						tileFootprint.resolve(response.data);
					} else {
						tileFootprint.reject(null, response.status, response.message);
					}
				},
				error: function (jqXHR, status, error) {
					tileFootprint.reject(jqXHR, status, error);
				}
			});
			return tileFootprint.promise();
		};
		
		// Initialize the tags control
		$tileTags.tagsInput({
			placeholder	: "Add a Sentinel-2 tile",
			limit		: 1,
			minChars	: 0,
			maxChars	: null,
			interactive	: true,
			autocomplete: null,
			unique		: true,
			confirmKeys	: [ 188, 32 ],
			onAddTag    : function (elm, tag) {
				var footprint = false;
				$.when(getTileFootprint(tag)).done(function (response) {
					if (footprint = createPolygonOnMap(_map, response)) {
						$("+.tagsinput .tag", elm).addClass("match").data({ "footprint": footprint });
						showMsg("New footprint set", "INFO");
					}
					// Restore tile's footprint on map when a the tag is clicked
					$("+.tagsinput", elm).on("click", ".tag:not(.match,.error)", function (e) {
						createPolygonOnMap(_map, response);
					});
				}).fail(function (jqXHR, status, error) {
					$("+.tagsinput .tag", elm).addClass("error");
					showMsg("Inconsistent footprint information for the selected tile.<br/>Please enter a correct Setinel-2 tile.", "ERROR");
				});
			}
		});
		$('[href="#tileTags_tag"].focus-on').attr("href", "#" + $tileTags.attr("id") + "_tag");
	}
	
	// Initialize map
	function initializeMap(_map, $mapExtent, $tileTags, $form) {
		// Actions to take when the Edit modal page is opened or closed
		var toggleModalVisibility = function (e) {
			if (e.type == "shown") {
				$('[name="name"]', $form).focus();
				if (_map.mapActive) {
					adjustMapSize(_map);
					setTimeout(function () { _map.fitAllFeatures(); }, 50);
				}
			} else if (e.type == "hidden") {
				$myModalNodes.unbind("shown.bs.modal hidden.bs.modal", toggleModalVisibility);
			}
		}
		$myModalNodes.on("shown.bs.modal hidden.bs.modal", toggleModalVisibility);
		
		// Initialize map
		$mapExtent.poly2D({
			startLat: 4,
			startLon: 15,
			maxFeaturesNo: 1,
			defaultFootprint: _map?.siteFootprint || "",
			loaded: function (olPoly) {
				$.extend(_map, olPoly);
				_map.el.removeClass("hidden");
				
				// Initialize the tags control for tiles
				initializeTileTags($tileTags, _map);
			}
		});
		
		// Check whether the new footprint matches the tile footprint and mark the tile control accordingly
		$mapExtent.on("newfootprint", function (e, footprint) {
			if ($('[name="footprint"]', $form).length) {
				var tagFootprint = $("+.tagsinput .tag", $tileTags).data("footprint");
				$('[name="footprint"]', $form).val(footprint);
				if (tagFootprint == footprint) {
					$("+.tagsinput .tag", $tileTags).addClass("match");
				} else {
					$("+.tagsinput .tag", $tileTags).removeClass("match");
				}
				$('[name="footprint"]', $form).valid();
			}
		});
	};
	
	// Initialize form
	function initializeForm($form, initData) {
		// Form labels
		if (initData?.footprint) {
			$("#myModalLabel").html('Edit site');
			$("#btnSave"     ).html('Save changes');
			$("#reset"       ).html('<span>Restore site&nbsp;&nbsp;<i class="fa fa-refresh"></i></span>');
		}
		
		// Name
		$('[name="name"]', $form).val(initData?.name || "");
		
		// Description
		$('[name="description"]', $form).val(initData?.description || "");
		
		// Date picker controls for startDate and endDate
		$('[name="startDate"]', $form).val(initData?.startDate ? moment(initData.startDate).format("YYYY-MM-DD") : "");
		$('[name="endDate"  ]', $form).val(initData?.endDate   ? moment(initData.endDate  ).format("YYYY-MM-DD") : "");
		initializeDatepickerControls($('[name="startDate"]', $form), $('[name="endDate"]', $form));
		
		// Tile tags
		var $tileTags = $('[name="tileTags"]', $form);
		
		// Map
		if (initData?.map?.mapActive) {
			// Edit site
			if (initData?.footprint) {
				// Manage footprint on map
				createPolygonOnMap(initData.map, initData.footprint.replace("MULTIPOLYGON (((", "POLYGON((").replace(")))", "))").replace(" ((", "(("));
			
			// Add new site
			} else {
				// Manage footprint on map
				initData.map.removeAllFeatures(); initData.map.startDrawing();
				// Manage tile tags
				initializeTileTags($tileTags, initData.map); //34TGQ
			}
		} else {
			// Initialize map
			initData.map = { mapActive: false, siteFootprint: initData?.footprint || "" };
			initializeMap(initData.map, $("#mapExtent"), $tileTags, $form);
		}
	}
	
	// Document ready
	$(document).ready( function() {
		var $form = $("#frmContainer");
		var action   = window.userOpStack?.action || "";
		var initData = $.extend({}, window?.userOpStack?.dna || {});
		
		// Initialize form
		initializeForm($form, initData);
		
		// Scroll element into view
		$("a.scroll-into-view, a.focus-on").on("click", function (e) {
			e.preventDefault();
			if ($(e.target).hasClass("scroll-into-view")) {
				$($(e.target).attr("href")).eq(0).scrollIntoView({ behavior: "smooth" });
			}
			if ($(e.target).hasClass("focus-on")) {
				$($(e.target).attr("href")).eq(0).focus();
			}
		});
		
		// Custom validations for site name (accepted characters & unique and trimmed name)
		$.validator.addMethod("siteName", function (value, element, params) {
			$.validator.messages.siteName = params?.message || "Remove invalid characters.";
			return value.length == 0 || value.match(new RegExp(params.regEx, "g"));
		}, $.validator.messages.siteName);
		$.validator.addMethod("isUnique", function (value, element, params) {
			return $.inArray(value, nameList) == -1 || (initData?.name && (value === initData.name));
		}, "Site's name must be unique.");
		$.validator.addMethod("isTrimmed", function (value, element, params) {
			$.validator.messages.isTrimmed = params?.message || "Remove trailing and leading invalid characters [" + params.chars + "].";
			return !value.match(new RegExp("^(^[" + params.chars + "]+)|([" + params.chars + "]+$)$", "g"));
		}, $.validator.messages.isTrimmed);
		
		// Validate form before submit
		var fValidator = $form.validate({
			rules: {
				name: {
					required : true,
					minlength: 2,
					isUnique : true,
					isTrimmed: { chars: "- ", message: "Remove trailing and leading spaces or dashes." },
					siteName : { regEx: "^[A-Za-z0-9][A-Za-z0-9- ]*[A-Za-z0-9]$", message: "Remove invalid characters (allowed: letters, numbers, spaces and dashed)." }
				},
				description: { required: true },
				startDate  : { required: true },
				endDate    : { required: true },
				footprint  : { required: true }
			},
			highlight     : function(element, errorClass) {
				$(element).parent().addClass("has-error");
				setTimeout(function () { adjustMapSize(initData?.map); }, 500);
			},
			unhighlight   : function(element, errorClass) {
				$(element).parent().removeClass("has-error");
				setTimeout(function () { adjustMapSize(initData?.map); }, 500);
			},
			messages      : { },
			success       : function(label) { label.remove(); },
			errorPlacement: function(error, element) { error.appendTo(element.parent()); }
		});
		
		// Reset form data
		$form.on("reset", function (e) {
			e.preventDefault();
			initializeForm($(this), initData);
			fValidator.resetForm();
		});
		
		// Disable form submit on keypress (Enter)
		$form.on("keyup keypress", ".form-control", function (e) {
			if ((e.keyCode || e.which) === 13) { e.preventDefault(); return false; }
		});
		
        // Submit form
		$form.on("submit", function (e) {
			e.preventDefault();
			if ($(this).valid()) {
				var formData = {
					name       :        $('[name="name"       ]', this).val(),
					description:        $('[name="description"]', this).val(),
					startDate  : moment($('[name="startDate"  ]', this).val()).format("YYYY-MM-DDTHH:mm:ss"),
					endDate    : moment($('[name="endDate"    ]', this).val()).format("YYYY-MM-DDTHH:mm:ss"),
					footprint  :        $('[name="footprint"  ]', this).val()
				};
				if (action == "edit") {
					formData.id = initData.id;
					formData.userId = taoUserProfile.id;
				}
				$.ajax({
					cache   : false,
					url     : baseRestApiURL + "site/" + (action == "edit" ? formData.id : ""),
					type    : (action == "edit" ? "PUT" : "POST"),
					dataType: "json",
					data    : JSON.stringify(formData),
					headers : {
						"Accept"      : "application/json",
						"Content-Type": "application/json",
						"X-Auth-Token": window.tokenKey
					},
					error: function (jqXHR, textStatus, errorThrown) {
						if (jqXHR.status === 500) {
							showMsg("Error updating site. Please check your data and try again.", "ERROR");
						} else {
							showMsg("Unknown error. Unable to update site. Please try again.", "ERROR");
						}
					},
					success: function (response) {
						if (response.status === window.responseStatus.success) {
							showMsg("Site successfully saved.", "SUCCESS");
							$myModalNodes.modal("hide");
							panelComp.refreshData();
						} else {
							showMsg("Error " + (action == "edit" ? "updating" : "adding") + " site. Please check your data and try again.", "ERROR");
						}
					}
				});
			}
			return false; // To avoid actual submission of the form
		});
	});

//# sourceURL=sites-plus.js
</script>
