<style>
	#showResults {
		.modal-title  {
			@media (min-width: 768px) {& {white-space:nowrap;text-overflow:ellipsis;overflow:hidden;}}
		}
		.details {
			.row {font-style:italic;color:white;line-height:1.2em;font-weight:300;margin-top:10px;>* {margin:0;}}
			@media (min-width: 768px) {.row {padding-left:45px;margin-top:5px;}}
		}
		#rm_result_attr   {min-height:15em;max-height:calc(100vh - 23em);overflow-y:auto;padding:10px 10px 10px 0;margin-right:-10px;margin-bottom:-10px;
			.panel.empty  {background-color:rgb(221 75 57/0.1);}
			.panel-header {display:flex;align-items:center;word-break:break-word;gap:1em;}
			.helper       {flex-grow:1;display:flex;align-items:center;gap:0.5em;
				>*        {flex-grow:0;flex-shrink:0;width:5em;color:#777777;text-align:center;}
				.name     {flex-grow:1;flex-shrink:1;width:auto;color:inherit;text-align:left;display:flex;align-items:center;}
				.name .fa {font-size:1.6em;margin-right:0.2em;line-height:1.4em;flex-shrink:0;}
				.time     {line-height:1;margin-top:0.4em;margin-bottom:-0.4em;small {display:block;}}
			}
			.btns         {display:flex;align-items:center;justify-content:center;gap:0.7em;flex-grow:0;flex-shrink:0;}
			.btns a       {cursor:default;}
			.panel-attr   {word-break:break-all;
				p         {display:flex;line-height:1.2em;text-align:right;}
				p>label   {margin:0 1em 0 0;min-width:6em;flex-shrink:0;color:#333;}
				p>span    {text-align:left;flex-grow:1;max-height:3.6em;overflow-y:auto;color:#333;}
			}
			/* Responsive */
						   @media (max-width: 767px) {& {max-height:unset;}}
			.panel-header {@media (max-width: 450px) {& {flex-direction:column;}}}
			.helper       {@media (max-width: 767px) {& {flex-wrap:wrap;justify-content:flex-end;}}
						   @media (max-width: 450px) {& {max-width:100%;}}}
			.panel-attr p {@media (max-width: 450px) {& {flex-direction:column;text-align:left;}}}
		}
		#rm_preview_img   {position:fixed;cursor:pointer;top:1em;bottom:1em;left:1%;right:1%;border-radius:5px;width:98%;height:calc(100% - 2em);object-fit:contain;background-color:rgba(0,0,0,0.5);
			.modal-dialog:has(&.full-screen) {-webkit-transform:none;transform:none;transition:none;}
		}
	}
</style>

<div id="showResults" class="modal-content">
	<div class="modal-header">
		<button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span><span class="sr-only">Close</span></button>
		<h4 class="modal-title">Execution Results &nbsp;<small style="font-weight:300;color:white;">The outputs of the <strong>selected</strong> workflow.</small></h4>
		<div class="details"></div>
	</div>
	<div class="modal-body">
		<div id="rm_result_attr" class="panel-list"></div>
		<img id="rm_preview_img" class="hidden" src="" />
	</div>
	<div class="modal-footer">
		<button type="button" class="btn btn-flat btn-default" data-dismiss="modal">Close</button>
	</div>
</div>

<script type="text/javascript">
	var $showResults = $("#showResults");
	var $resultAttr  = $("#rm_result_attr");
	var $previewImg  = $("#rm_preview_img");
	
	// Show workflow details
	function showWorkflowDetails(wf) {
		var wfDetails = '<div class="row"><label class="col-sm-3 col-md-2">Workflow name:</label><div class="col-sm-9 col-md-10">' + wf.name       + '</div></div>' +
						'<div class="row"><label class="col-sm-3 col-md-2">Initiator:</label>    <div class="col-sm-9 col-md-10">' + wf.userId     + '</div></div>' +
						'<div class="row"><label class="col-sm-3 col-md-2">Status:</label>       <div class="col-sm-9 col-md-10">' + wf.status     + '</div></div>' +
						'<div class="row"><label class="col-sm-3 col-md-2">Visibility:</label>   <div class="col-sm-9 col-md-10">' + wf.visibility + '</div></div>' +
						'<div class="row"><label class="col-sm-3 col-md-2">Active:</label>       <div class="col-sm-9 col-md-10">' +  (wf.active ? "yes" : "no")  + '</div></div>';
		$(".details", $showResults).html(wfDetails);
	}
	
	// Prettify file size
	function formatSizeUnits(bytes) {
		if      (bytes >= 1073741824) { bytes = (bytes / 1073741824).toFixed(2) + " GB"; }
		else if (bytes >=    1048576) { bytes = (bytes /    1048576).toFixed(2) + " MB"; }
		else if (bytes >=       1024) { bytes = (bytes /       1024).toFixed(2) + " KB"; }
		else if (bytes >           1) { bytes = bytes + " bytes"; }
		else if (bytes ==          1) { bytes = bytes + " byte" ; }
		else                          { bytes = "0 bytes"; }
		return bytes;
	}
	
	// Preview the execution result if RASTER type
	function previewImgResult(a) {
		var crtId = $previewImg.data("id");
		var newId = $(a).closest(".panel-header").next(".panel-attr").attr("id") + "_img";
		!(crtId && crtId == newId) && $previewImg.attr("src", "");
		if ($previewImg.attr("src") == "") {
			$.ajax({
				url    : a.href || "#",
				type   : "GET",
				headers: { "X-Auth-Token": window.tokenKey },
				error  : function (jqXHR, textStatus, error) {
					// Flash element with error
					var $el = $(a).closest(".panel-header");
					$el.addClass("flash-error"); setTimeout(function () { $el.removeClass("flash-error"); }, 500);
					// Show error message
					var msg = error?.message || error;
					(msg === "") && (msg = jqXHR?.responseText || "");
					(msg === "") && (msg = "Error while extracting the preview.");
					showMsg(msg, "WARNING");
				},
				success: function(response) {
					$previewImg.attr("src", "data:image/jpeg;base64, " + response);
					$previewImg.addClass("full-screen").removeClass("hidden");
					$previewImg.data("id", newId);
				}
			});
		} else {
			$previewImg.addClass("full-screen").removeClass("hidden");
		}
	}
	
	// Populate the execution results list
	function renderResults(results, error) {
		if (results) {
			// Render files
			$.each(results, function (idx, file) {
				var ftype  = file.relativePath.substring(file.relativePath.lastIndexOf("."));
				var fafile = "fa-file-o";
				switch (file.format) {
					case "VECTOR" : fafile = "fa-file-image-o"; break;
					case "FOLDER" : fafile = "fa-folder-o"    ; break;
					case "JSON"   : fafile = "fa-file-code-o" ; break;
					case "RASTER" : fafile = "fa-file-image-o"; break;
					default:                                             if ($.inArray(ftype, [ ".tif", ".tiff", ".png", ".jpg", ".jpeg", ".gif", ".bmp" ]) != -1) {
									fafile = "fa-file-image-o"  ; } else if ($.inArray(ftype, [ ".img", ".ntf", ".hdf", ".hd5", ".grb", ".grb2", ".nc"   ]) != -1) {
									fafile = "fa-file-image-o"  ; } else if ($.inArray(ftype, [ ".txt", ".log"                                           ]) != -1) {
									fafile = "fa-file-text-o"   ; } else if ($.inArray(ftype, [ ".html", ".xml", ".json"                                 ]) != -1) {
									fafile = "fa-file-code-o"   ; } else if ($.inArray(ftype, [ ".pdf"                                                   ]) != -1) {
									fafile = "fa-file-pdf-o"    ; } else if ($.inArray(ftype, [ ".zip", ".rar", ".7z", ".tar", ".gz", ".jar", ".war"     ]) != -1) {
									fafile = "fa-file-archive-o"; }
									break;
				}
				var pidx = "job_" + file.jobId + "_task_" + file.taskId + "_" + idx;
				var name = '<i class="fa ' + fafile + ' fa-fw"></i><span class="title">' + file.name + '</span>';
				var type = file.format;
				var size = formatSizeUnits(file.size);
				var time = moment(file.endTime).format("YYYY-MM-DD") + ' <small>' + moment(file.endTime).format("HH:mm:ss") + '</small>';
				var btns = (type === "RASTER") ? '<a class="quickview" href="' + (baseRestApiURL + file.previewUrl.substr(1)) + '"><button class="btn btn-success btn-nodeop" data-toggle="tooltip" data-original-title="Quick view" data-action="preview" ><i class="fa fa-eye      fa-fw"></i></button></a>' : '';
					btns = btns +                '<a class="download"  href="' + (baseRestApiURL + file.url.substr(1))        + '"><button class="btn btn-primary btn-nodeop" data-toggle="tooltip" data-original-title="Download"   data-action="download"><i class="fa fa-download fa-fw"></i></button></a>';
				var $el = $('<div class="job-history-one success panel">' +
								'<div class="panel-header">' +
									'<a href="#' + pidx + '" class="helper collapsed" data-toggle="collapse">' +
										'<span class="name">' + name + '</span>' +
										'<span class="type">' + type + '</span>' +
										'<span class="size">' + size + '</span>' +
										'<span class="time">' + time + '</span>' +
									'</a>' +
									'<div class="btns">' + btns + '</div>' +
								'</div>' +
								'<div id="' + pidx + '" class="panel-attr collapse" data-parent="#' + $resultAttr.attr("id") + '"></div>' +
							'</div>');
				$.each(file, function (key, value) {
					$("#" + pidx, $el).append('<p><label>' + key + ':</label><span>' + value + '</span></p>');
				});
				$resultAttr.append($el);
			});
			if ($(".job-history-one", $resultAttr).length == 0) {
				var $el = $('<div class="job-history-one cancelled panel empty"><div class="panel-header"><span class="title">No execution results to display.</span></div></div>');
				$resultAttr.append($el);
			}
		} else {
			var $el = $('<div class="job-history-one cancelled panel empty"><div class="panel-header"><span class="title">' + (error || 'No execution results to display.') + '</span></div></div>');
			$resultAttr.append($el);
		}
	}
	
	// Get workflow execution results
	function getWorkflowResults(workflowId) {
		$.ajax({
			url     : baseRestApiURL + "orchestrator/outputs/" + workflowId,
			type    : "GET",
			dataType: "json",
			headers : {
				"Accept"      : "application/json",
				"Content-Type": "application/json",
				"X-Auth-Token": window.tokenKey
			},
			error: function (jqXHR, textStatus, error) {
				var msg = error?.message || error;
				(msg === "") && (msg = jqXHR?.responseText || "");
				(msg === "") && (msg = "Error while loading files.");
				renderResults(null, msg);
			},
			success: function(response) {
				if (response.status == responseStatus.success) {
					renderResults(response.data);
				} else {
					renderResults(null, response.message);
				}
			}
		});
	}
	
	$(document).ready(function () {
		var initData = $.extend({}, window.userOpStack?.dna || {});
		
		// Show workflow details
		showWorkflowDetails(initData);
		
		// Get execution results for the selected workflow
		getWorkflowResults(initData.id);
		
		// Quickview execution result
		$resultAttr.on("click", ".quickview", function (e) {
			e.stopPropagation();
			e.preventDefault();
			previewImgResult(this);
		});
		
		// Download execution result
		$resultAttr.on("click", ".download", function (e) {
			e.stopPropagation();
			var $a = $(this);
			if ($a.hasClass("disabled")) {
				e.preventDefault();
			} else {
				$a.addClass("disabled");
				$(".btn i", $a).removeClass("fa-download").addClass("fa-refresh fa-spin");
				$(".btn", $a).prop("disabled", true);
				setTimeout(function () {
					$a.removeClass("disabled");
					$(".btn i", $a).removeClass("fa-refresh fa-spin").addClass("fa-download");
					$(".btn", $a).prop("disabled", false);
				}, 5000);
			}
		});
		
		$previewImg.on("click", function (e) {
			$(this).addClass("hidden").removeClass("full-screen");
		});
	});
	
//# sourceURL=workflow-show-results.js
</script>
