<script type="text/javascript">
	// Unshare dataset
	var unshareDataset = function (name) {
		$.ajax({
			cache  : false,
			url    : baseRestApiURL + "files/unshare?name=" + name,
			type   : "POST",
			headers: {
				"Accept"      : "application/json",
				"Content-Type": "application/json",
				"X-Auth-Token": window.tokenKey
			},
			error: function (jqXHR, textStatus, errorThrown) {
				if(jqXHR.status === 500 ){
					showMsg("Unable to unshare dataset. Please try again.", "ERROR");
				} else {
					alert("An error has occurred, please try again or contact app admin.");
				}
			},
			success: function (response) {
				if (response.status === "SUCCEEDED") {
					showMsg("Product set successfully unshared.", "SUCCESS");
				} else {
					showMsg("An error has occured. Could not unshare dataset.", response.status);
				}
				panelComp.refreshData();
			}
		});
	};
	
	$(document).ready(function () {
		var $selectActivePanel = $("#selectActivePanel");
		var urls = [ baseRestApiURL + "files/share/list" ];
		var actionsSet = {
			"manage_shared_datasets": { badgeLabel: "Shared Datasets", pagLabel: "datasets", emptyLabel: "shared dataset", url: urls[0] }
			
		};
		var getActiveSet = function (data, sets) {
			var action = $('[data-toggle="tab"][aria-expanded="true"]', $selectActivePanel).data("action");
			var selected = (typeof action === "undefined" || typeof actionsSet[action].filter === "undefined") ? data : _.where(data, actionsSet[action].filter);
			if (typeof action !== "undefined") {
				if (typeof sets !== "undefined") {
					$.each(sets, function (idx, set) {
						// Select active set
						var setAction = _.findKey(actionsSet, { url: idx });
						var filterSet = (typeof actionsSet[setAction].filter === "undefined") ? set : _.where(set, actionsSet[setAction].filter);
						if (setAction === action) { selected = filterSet; }
						// Refresh count badge for all action sets
						$('select>[value="' + setAction + '"]', $selectActivePanel).html((actionsSet[setAction]?.badgeLabel || setAction) + ' (' + filterSet.length + ')');
						$('[data-action="'  + setAction + '"]', $selectActivePanel).html((actionsSet[setAction]?.badgeLabel || setAction) + ' <span class="badge label-success">' + filterSet.length + '</span>');
					});
				}
				// Refresh count badge for current action set
				$('select>[value="' + action + '"]', $selectActivePanel).html((actionsSet[action]?.badgeLabel || action) + ' (' + selected.length + ')');
				$('[data-action="'  + action + '"]', $selectActivePanel).html((actionsSet[action]?.badgeLabel || action) + ' <span class="badge label-success">' + selected.length + '</span>');
				// Change texts specific to current action set
				$(".val-title", ".bottom-controls"       ).text(actionsSet[action]?.pagLabel   || action);
				$(".val-title", ".nppaginatedcells-empty").text(actionsSet[action]?.emptyLabel || action);
				$(".top-controls .search-container").attr("data-original-title", "Search " + (actionsSet[action]?.emptyLabel || action));
			}
			return selected;
		};
		window.panelComp = $("#panel-nodes").npPaginatedCells({
			headerUser: taoUserProfile.username,
			url       : urls,
			viewMode  : preferences.viewMode,
			order     :[
				{ "label": "Name ascending" , "objAttributeName": "name", "direction": "ASC" },
				{ "label": "Name descending", "objAttributeName": "name", "direction": "DSC" }
			],
			filterAttribute: "_dsFilterBy",
			itemsOnPage: 12,
			doDataPreprocessing: function (data, sets) {
				var activeSet = getActiveSet(data, sets);
				$.each(activeSet, function (index, elX) {
					elX.created = moment(elX.created).format("YYYY-MM-DD HH:mm:ss");
					elX._dsFilterBy = ("[" + elX.name + "][" + elX.created + "][" + elX.dataRootPath + "]");
				});
				return activeSet;
			},
			doAction: function (action, args) {
				if (action === "unshare") {
					$("#confirm-dialog").modal("confirm", {
						msg: "Are you sure you want to unshare the dataset: <strong>" + args.dna.name + "</strong>?",
						callbackConfirm: function () {
							unshareDataset(args.dna.name);
						},
						callbackCancel: function () {}
					});
				}
			}
		});
	});
	
//# sourceURL=shared-datasets.js
</script>
