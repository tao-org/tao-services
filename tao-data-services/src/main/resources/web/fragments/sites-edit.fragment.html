<style>

	/*------FORM------*/

	}
</style>

<link rel="stylesheet" href="./assets/libs/jQuery-tags-input-autocomplete/jquery.tagsinput-revisited.css" type="text/css" />
<script src="./assets/libs/jQuery-tags-input-autocomplete/jquery.tagsinput-revisited.js" type="text/javascript"></script>

<script type="text/javascript">
	var $myModalNodes = $("#myModalNodes");
	
	// Initialize datepicker controls for start/end dates
	function initializeDatepickerControls ($startDate, $endDate) {
		// Remove old datepickers
		$("#" + $.datepicker.dpDiv.attr("id")).remove();
		
		// Set the mininum end date when start date changes
		var setMinEndDate = function () {
			var minEndDate = $startDate.datepicker('getDate');
			(minEndDate != null) && minEndDate.setDate(minEndDate.getDate() + 1);
			$endDate.datepicker('option', 'minDate', minEndDate);
		};
		
		// Initialize startDate datepicker
		$startDate.data("datepicker") && $startDate.datepicker("destroy");
		$startDate.datepicker({
			dateFormat: "yy-mm-dd",
			onSelect: function (date, picker) {
				setMinEndDate();
				picker.settings["dateAlreadySet"] = true;
			},
			onClose: function (date, picker) {
				if (!picker.settings["dateAlreadySet"]) {
					var date = moment(date);
					picker.input.val(date.isValid() ? moment(date).format('YYYY-MM-DD') : "");
					setMinEndDate();
				}
				picker.settings["dateAlreadySet"] = false;
			}
		});
		
		// Initialize endDate datepicker
		$endDate.data("datepicker") && $endDate.datepicker("destroy");
		$endDate.datepicker({
			dateFormat: "yy-mm-dd",
			onSelect: function (date, picker) {
				picker.settings["dateAlreadySet"] = true;
			},
			onClose: function (date, picker) {
				if (!picker.settings["dateAlreadySet"]) {
					var date = moment(date);
					picker.input.val(date.isValid() ? moment(date).format('YYYY-MM-DD') : "");
					if (date.toDate() <= $('#startDate').datepicker('getDate')) {
						picker.input.val("");
					}
				}
				picker.settings["dateAlreadySet"] = false;
			}
		});
		
		// Initialize endDate min value
		if ($startDate.val() != "") { setMinEndDate(); }
	}
	
	// Adjust the map size to match its container's boundaries
	function adjustMapSize(_map, $container) {
		var cTop = $container.offset().top;
		var cBtm = $container.outerHeight(true) - $container.height() - cTop;
		var marg = _map.el.offset().top + cBtm;
		
		var $form = $("form", $container);
		var minH = $form.length > 0 ? $form.height() - (_map.container.parent().outerHeight(true) - _map.container.parent().outerHeight()) : 550;
		
		_map.el.css({ "height": "calc(100vh - " + parseInt(marg + 0.5) + "px", "min-height": parseInt(minH + 0.5) + "px", "max-height": parseInt(minH + 0.5) + "px" });
		_map.updateMapSize(10);
	}
	
	// Draw a polygon on the map and use it as the site's footprint
	function createPolygonOnMap(_map, footprint) {
		if (_map.mapActive) {
			_map.userText.val(footprint);
			_map.btnParseUserText.get(0).click();
			if (!_map.userText.hasClass("error")) {
				return _map.userText.val();
			} else {
				_map.userText.focus();
				showMsg("Inconsistent footprint information for the selected tile", "WARNING");
			}
		}
		return false;
	};
	
	// Initialize tags control to accept Sentinel-2 tiles and use their geometry as site's footprint
	function initializeTileTags($tileTags, _map) {
		// Extract the footprint of a given Sentinel-2 tile
		var getTileFootprint = function (tileId) {
			var tileFootprint = $.Deferred();
			$.ajax({
				url: baseRestApiURL + "query/footprint",
				type: "GET",
				data: { satellite: "sentinel2", tile: tileId },
				beforeSend: function(xhr) { xhr.setRequestHeader("X-Auth-Token", tokenKey); },
				success: function(response) {
					if (response.status === "SUCCEEDED") {
						tileFootprint.resolve(response.data);
					} else {
						tileFootprint.reject(null, response.status, response.message);
					}
				},
				error: function (jqXHR, status, error) {
					tileFootprint.reject(jqXHR, status, error);
				}
			});
			return tileFootprint.promise();
		};
		
		// Initialize the tags control
		$tileTags.tagsInput({
			placeholder	: 'Add a Sentinel-2 tile',
			limit		: 1,
			minChars	: 0,
			maxChars	: null,
			interactive	: true,
			autocomplete: null,
			unique		: true,
			confirmKeys	: [188, 32],
			onAddTag    : function (elm, tag) {
				var footprint = false;
				$.when(getTileFootprint(tag)).done(function (response) {
					if (footprint = createPolygonOnMap(_map, response)) {
						$("+.tagsinput .tag", elm).addClass("match").data({ "footprint": footprint });
						showMsg("New footprint set", "INFO");
					}
					// Restore tile's footprint on map when a the tag is clicked
					$("+.tagsinput", elm).on("click", ".tag:not(.match,.error)", function (e) {
						createPolygonOnMap(_map, response);
					});
				}).fail(function (jqXHR, status, error) {
					$("+.tagsinput .tag", elm).addClass("error");
					showMsg("Inconsistent footprint information for the selected tile.<br/>Please enter a correct Setinel-2 tile.", "ERROR");
				});
			}
		});
	}
	
	// Initialize map
	function initializeMap(_map, $mapExtent, $tileTags) {
		// Actions to take when the Edit modal page is opened or closed
		var toggleModalVisibility = function (e) {
			if (e.type == "shown") {
				if (_map.mapActive) {
					adjustMapSize(_map, _map.el.closest(".modal-dialog"));
					setTimeout(function () { _map.fitAllFeatures(); }, 50);
				}
			} else if (e.type == "hidden") {
				$myModalNodes.unbind("shown.bs.modal hidden.bs.modal", toggleModalVisibility);
			}
		}
		$myModalNodes.on("shown.bs.modal hidden.bs.modal", toggleModalVisibility);
		
		// Initialize map
		$mapExtent.poly2D({
			startLat: 4,
			startLon: 15,
			maxFeaturesNo: 1,
			defaultFootprint: _map.siteFootprint,
			loaded: function (olPoly) {
				$.extend(_map, olPoly);
				_map.el.removeClass("hidden");
				
				// Initialize the tags control for tiles
				initializeTileTags($tileTags, _map);
			}
		});
		
		// Check whether the new footprint matches the tile footprint and mark the tile control accordingly
		$mapExtent.on("newfootprint", function (e, footprint) {
			var tagFootprint = $("+.tagsinput .tag", $tileTags).data("footprint");
			$('#frmEditSiteContainer [name="footprint"]').val(footprint);
			if (tagFootprint == footprint) {
				$("+.tagsinput .tag", $tileTags).addClass("match");
			} else {
				$("+.tagsinput .tag", $tileTags).removeClass("match");
			}
		});
	};
	
	// Initialize form
	function initializeForm($form, initData) {
		// Name
		$('[name="name"]', $form).val(initData?.name || "");
		
		// Description
		$('[name="description"]', $form).val(initData?.description || "");
		
		// Date picker controls for startDate and endDate
		initData?.startDate && $('[name="startDate"]', $form).val(moment(initData.startDate).format("YYYY-MM-DD"));
		initData?.endDate   && $('[name="endDate"  ]', $form).val(moment(initData.endDate  ).format("YYYY-MM-DD"));
		initializeDatepickerControls($('[name="startDate"]', $form), $('[name="endDate"]', $form));
		
		// Footprint
		if (initData?.footprint) {
			if (initData?.map?.mapActive) {
				var geometry = initData.footprint.replace("MULTIPOLYGON (((", "POLYGON((").replace(")))", "))").replace(" ((", "((");
				createPolygonOnMap(initData.map, geometry);
			} else {
				// Initialize map
				initData.map = { mapActive: false, siteFootprint: initData.footprint };
				initializeMap(initData.map, $("#mapExtent"), $("#tileTags"));
			}
		}
	}
	
	// Document ready
	$(document).ready( function() {
		var $form = $("#frmEditSiteContainer");
		var initData = $.extend({}, window?.userOpStack?.dna || {});
		
		// Initialize form
		initializeForm($form, initData);
		
		// Custom validations for container name (accepted characters & unique name)
		$.validator.addMethod("containerName", function (value, element, params) { return value.length == 0 || value.match(new RegExp(params.regEx, "g")); }, "Remove invalid characters ( site's name must be unique, only allowed small caps letters (a-z), numbers (0-9) and dashes (-)).")
		$.validator.addMethod("isUnique"     , function (value, element, params) { return $.inArray(value, nameList) == -1 || value == initData.name; }, "Site's name must be unique.");
		
		// Scroll element into view
		$("a.scroll-into-view, a.focus-on").on("click", function (e) {
			e.preventDefault();
			if ($(e.target).hasClass("scroll-into-view")) {
				$($(e.target).attr("href"))[0].scrollIntoView({ behavior: "smooth" });
			}
			if ($(e.target).hasClass("focus-on")) {
				$($(e.target).attr("href"))[0].focus();
			}
		});
		
		// Restore form data
		$("#restore").on("click", function (e) {
			e.preventDefault();
			initializeForm($form, initData);
			$form.valid();
		});
		
		// Validate form before submit
		$form.validate({
			rules: {
				name       : { required: true, isUnique: true, containerName: { regEx: "^[a-zA-Z0-9- ]+$" } },
				description: { required: true },
				startDate  : { required: true },
				endDate    : { required: true },
				footprint  : { required: true }
			},
			highlight     : function(element, errorClass) { $(element).parent().addClass("has-error"); },
			unhighlight   : function(element, errorClass) { $(element).parent().removeClass("has-error"); },
			messages      : { },
			success       : function(label) { label.remove(); },
			errorPlacement: function(error, element) {
				error.appendTo(element.parent());
				setTimeout(function () { initData?.map?.mapActive && adjustMapSize(initData.map, initData.map.el.closest(".modal-dialog")); }, 500);
			}
		});
		
		// Disable form submit on keypress (Enter)
		$form.on("keyup keypress", ".form-control", function (e) {
			if ((e.keyCode || e.which) === 13) { e.preventDefault(); return false; }
		});
		
        // Submit form
		$form.submit(function (event) {
			event.preventDefault();
			var formData = {
				id         : initData.id,
				userId     : taoUserProfile.id,
				name       :        $('[name="name"       ]', this).val(),
				description:        $('[name="description"]', this).val(),
				startDate  : moment($('[name="startDate"  ]', this).val()).format("YYYY-MM-DDTHH:mm:ss"),
				endDate    : moment($('[name="endDate"    ]', this).val()).format("YYYY-MM-DDTHH:mm:ss"),
				footprint  :        $('[name="footprint"  ]', this).val()
			};
			
			if ($(this).valid()) {
				$(".modal-error").fadeOut();
				$.ajax({
					cache   : false,
					url     : baseRestApiURL + "site/" + formData.id,
					dataType: 'json',
					type    : "PUT",
					data    : JSON.stringify(formData),
					headers : {
						"Accept"      : "application/json",
						"Content-Type": "application/json",
						"X-Auth-Token": window.tokenKey
					},
					error: function (jqXHR, textStatus, errorThrown) {
						if (jqXHR.status === 500) {
							showMsg("Error updating site. Please check your data and try again.", "ERROR");
						} else {
							showMsg("Unknown error. Unable to update site. Please try again.", "ERROR");
						}
					},
					success: function(response,textStatus, jqXHR) {
						var r = chkTSRF(response);
						if (response.status === "FAILED") {
							if (response.message) {
								showMsg("Error updating site service. Please check your data, one or more values for the attributes were not correct.", "ERROR");
								//handle error messages
								
								var objResponse = JSON.parse(jqXHR.responseText);
								objResponse = objResponse.message.split(';');
								if (objResponse[0] !== "Entity has validation errors") {
									return;
								} 
								for (i = 0; i < objResponse.length; i ++) {
									var matches = objResponse[i].match(/\[(.*?)\]/);
									if (matches) {
										$(".error-"+matches[1],".modal-error").css('display', 'inline-block');
									}
								}
								$(".modal-error ").fadeIn("slow");
								$myModalNodes.animate({ scrollTop: 0 }, 250);
								return;
							}
							showMsg("Error updating site. Please check your data and try again.", "ERROR");
						}
						showMsg("Site successfully saved.", "SUCCESS");
						$myModalNodes.modal('hide');
						panelComp.refreshData();
					}
				});
			}
			return false; // To avoid actual submission of the form
		});
	});

//# sourceURL=sites-edit.js
</script>
