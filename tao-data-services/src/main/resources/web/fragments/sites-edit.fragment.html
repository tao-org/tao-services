<style>
	.modal-error      {background-color:red;}
	.modal-error span {background:#a63f3f;}
	
	/*------FORM------*/
	#frmEditSiteContainer {
		.tagsinput:has(.tag) {
			width:fit-content!important;
			.tag-input {display:none;}
		}
		.tag                      {margin-right:0;border:2px solid transparent;border-radius:3px;cursor:pointer;}
		.tag.match                {background:#0099ff;}
		.tag.error                {background:#a63f3f;cursor:default;border-color:transparent!important;}
		.tag:has(.tag-text:hover) {border-color:rgb(255 255 255/0.5);}
		.tag .tag-remove:hover    {transform:scale(1.3);}
		[name=footprint][readonly]{color:#ccc;padding-top:0;padding-bottom:0;word-break:break-all;}
	}
	/*------MAP------*/
	#myModalNodes {
		#mapExtent {position:relative;display:block;margin:-15px;width:calc(100% + 30px);height:550px;min-height:550px;background-color:white;overflow:hidden;}
		#myFlatMap {
			.map {border:1px solid #96c1ce;}
			.poly-actions-panel {
				width:50rem;max-width:100%;right:0;bottom:0;
				textarea {font-size:0.8em;line-height:1;}
				.btn-poly:disabled {pointer-events:none;}
			}
			.sliderscontainer {display:none;}
		}
	}
</style>
<div class="modal-content">
	<div class="modal-header">
		<button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span><span class="sr-only">Close</span></button>
		<h4 class="modal-title" id="myModalLabel">Edit site</h4>
	</div>
	<div class="modal-error collapse">
		<h4 class="modal-title">Error updating site!</h4>
		<p id="modal-error-msg">Please check your data.</p>
		<p><span class="error-container collapse"><i class="fa fa-exclamation-triangle fa-fw"></i>Error.</span></p>
	</div>
	<div class="modal-body">
		<div class="row">
			<!-- FORM -->
			<div class="col-sm-4 col-md-4">
				<form id="frmEditSiteContainer" class="form-horizontal clearfix" action="" role="form">
					<input type="hidden" name="system" value="true" />
					<div class="form-group">
						<label for="name" class="col-sm-12 col-md-12" style="font-size: large;">Define your area of interest</label>
						<div class="col-sm-12 col-md-12">
							<div class="form-group has-feedback">
								<label for="name" class="col-sm-12 col-md-12">Name</label>
								<div class="col-sm-12 col-md-12">
									<input type="text" class="form-control" id="name" name="name" placeholder="name" autocomplete="off" value="" />
								</div>
							</div>
						</div>
						<div class="col-sm-12 col-md-12">
							<div class="form-group">
								<label for="description" class="col-sm-12 col-md-12 ">Description</label>
								<div class="col-sm-12 col-md-12">
									<textarea class="form-control" rows="3" id="description" name="description" placeholder="description" autocomplete="off"></textarea>
								</div>
							</div>
						</div>
					</div>
					<div class="form-group">
						<div class="col-sm-8 col-md-8">
							<div class="form-group">
								<label for="polygon" class="col-sm-12 col-md-12">Polygon<sup>*</sup></label>
								<div class="col-sm-12 col-md-12">
									<textarea class="form-control" rows="2" name="footprint" placeholder="footprint" autocomplete="off" readonly="true"></textarea>
								</div>
								<label class="col-sm-12 col-md-12"><i style="font-weight:400">(*) draw on the <a class="scroll-into-view" href="#mapExtent">map</a> or select a <a class="focus-on" href="#polygon_tag">tile</a></i></label>
							</div>
						</div>
						<div class="col-sm-4 col-md-4">
							<div class="form-group">
								<label for="polygon" class="col-sm-12 col-md-12">Tile</i></label>
								<div class="col-sm-12 col-md-12">
									<input class="form-control tag-format" type="text" id="polygon" name="polygon" placeholder="polygon" autocomplete="off" />
								</div>
							</div>
						</div>
					</div>
					<div class="form-group">
						<label for="name" class="col-sm-12 col-md-12" style="font-size: large;">Choose your time period</label>
						<div class="col-sm-6 col-md-6">
							<div class="form-group">
								<label class="col-sm-12 col-md-12">Start date</label>
								<div class="col-sm-12 col-md-12">
									<input type="text" autocomplete="off" id="startDate" name="startDate" class="datepicker form-control" >
								</div>
							</div>
						</div>
						<div class="col-sm-6 col-md-6">
							<div class="form-group">
								<label class="col-sm-12 col-md-12">End date</label>
								<div class="col-sm-12 col-md-12">
									<input type="text" autocomplete="off" id="endDate" name="endDate" class="datepicker form-control" >
								</div>
							</div>
						</div>
					</div>
					<div class="form-group">
						<div class="col-sm-12 col-md-12">
							<div class="form-group">
								<div class="col-md-12 col-sm-12" style="text-align:center;">
									<button id="saveContainer" type="submit" class="btn btn-primary btn-submit" name="btnSave">Save changes</button>
								</div>
							</div>
						</div>
					</div>
				</form>
			</div>
			
			<!-- MAP -->
			<div class="col-sm-8 col-md-8">
				<div id="mapExtent" class="hidden"></div>
			</div>
		</div>
	</div><!-- /.modal-body -->

</div><!-- /.modal-content -->
<link rel="stylesheet" href="./assets/libs/jQuery-tags-input-autocomplete/jquery.tagsinput-revisited.css" type="text/css" />
<script src="./assets/libs/jQuery-tags-input-autocomplete/jquery.tagsinput-revisited.js" type="text/javascript"></script>

<script type="text/javascript">
	var $myModalNodes = $("#myModalNodes");
	var myPolygonMap  = { mapActive: false };
	
	// Initialize FORM
	function initializeForm($form, initData) {
		$('[name="name"       ]', $form).val(initData?.name        || "");
		$('[name="description"]', $form).val(initData?.description || "");
		initData?.startDate && $('[name="startDate"  ]', $form).val(moment(initData.startDate).format("YYYY-MM-DD"));
		initData?.endDate   && $('[name="endDate"    ]', $form).val(moment(initData.endDate  ).format("YYYY-MM-DD"));
	}
	
	// Initialize datepicker controls for start and end dates
	function initializeDatepickerControls ($startDate, $endDate) {
		// Remove old datepickers
		$("#" + $.datepicker.dpDiv.attr("id")).remove();
		
		// Set the mininum end date when start date changes
		var setMinEndDate = function () {
			var minEndDate = $startDate.datepicker('getDate');
			(minEndDate != null) && minEndDate.setDate(minEndDate.getDate() + 1);
			$endDate.datepicker('option', 'minDate', minEndDate);
		};
		
		// Initialize startDate datepicker
		$startDate.datepicker({
			dateFormat: "yy-mm-dd",
			onSelect: function (date, picker) {
				setMinEndDate();
				picker.settings["dateAlreadySet"] = true;
			},
			onClose: function (date, picker) {
				if (!picker.settings["dateAlreadySet"]) {
					var date = moment(date);
					picker.input.val(date.isValid() ? moment(date).format('YYYY-MM-DD') : "");
					setMinEndDate();
				}
				picker.settings["dateAlreadySet"] = false;
			}
		});
		
		// Initialize endDate datepicker
		$endDate.datepicker({
			dateFormat: "yy-mm-dd",
			onSelect: function (date, picker) {
				picker.settings["dateAlreadySet"] = true;
			},
			onClose: function (date, picker) {
				if (!picker.settings["dateAlreadySet"]) {
					var date = moment(date);
					picker.input.val(date.isValid() ? moment(date).format('YYYY-MM-DD') : "");
					if (date.toDate() <= $('#startDate').datepicker('getDate')) {
						picker.input.val("");
					}
				}
				picker.settings["dateAlreadySet"] = false;
			}
		});
		
		// Initialize endDate min value
		if ($startDate.val() != "") { setMinEndDate(); }
	}
	
	// Initialize the tags control to accept Sentinel-2 tiles and use their geometry as site's footprint
	function initializeTagsControl($tileTags) {
		// Extract the footprint of a given Sentinel-2 tile
		var getTileFootprint = function (tileId) {
			var deferred = $.Deferred();
				$.ajax({
					url: baseRestApiURL + "query/footprint",
					type: "GET",
					data: { satellite: "sentinel2", tile: tileId },
					beforeSend: function(xhr) { xhr.setRequestHeader("X-Auth-Token", tokenKey); },
					success: function(response) {
						if (response.status === "SUCCEEDED") {
							deferred.resolve(response.data);
						} else {
							deferred.reject(null, response.status, response.message);
						}
					},
					error: function (jqXHR, status, error) {
						deferred.reject(jqXHR, status, error);
					}
				});
			return deferred.promise();
		};
		
		// Initialize the tags control
		$tileTags.tagsInput({
			placeholder	: 'Add a Sentinel-2 tile',
			limit		: 1,
			minChars	: 0,
			maxChars	: null,
			interactive	: true,
			autocomplete: null,
			unique		: true,
			confirmKeys	: [188, 32],
			onAddTag    : function (elm, tag) {
				$.when(getTileFootprint(tag)).done(function (response) {
					$tileTags.trigger("newtilefootprint", [ response ]);
					$("+.tagsinput .tag", elm).on("click", function () {
						$tileTags.trigger("newtilefootprint", [ response ]);
					});
				}).fail(function (jqXHR, status, error) {
					$("+.tagsinput .tag", elm).addClass("error");
					showMsg("Inconsistent footprint information for the selected tile.<br/>Please enter a correct Setinel-2 tile.", "ERROR");
				});
			}
		});
	}
	
	// Adjust the map size to match its container's boundaries
	function adjustMapSize(_map, $container) {
		var cTop = $container.offset().top;
		var cBtm = $container.outerHeight(true) - $container.height() - cTop;
		var marg = _map.el.offset().top + cBtm;
		
		var $form = $("form", $container);
		var minH = $form.length > 0 ? $form.height() - (_map.container.parent().outerHeight(true) - _map.container.parent().outerHeight()) : 550;
		
		_map.el.css({ "height": "calc(100vh - " + parseInt(marg + 0.5) + "px", "min-height": parseInt(minH + 0.5) + "px" });
		_map.updateMapSize(10);
	}
	
	function updateMapSize(_map) {
		var $mCont = $mapExtent.closest(".modal-content");
		var $mBody = $(".modal-body"  , $mCont);
		var $mHead = $(".modal-header", $mCont);
		var marg = 3*$mCont.offset().top + $mHead.outerHeight(true);
		var minH = parseInt($("form", $mBody).outerHeight(true) + 0.5) + ($mBody.outerHeight() - $mBody.height());
		_map.el.css({ "height": "calc(100vh - " + parseInt(marg) + "px", "min-height": minH + "px" });
		_map.updateMapSize(10);
	}
	
	// Initialize map
	function initializeMap(_map, $mapExtent, $tileTags, initFootprint) {
		// Actions to take when the Edit modal page is opened or closed
		var toggleModalVisibility = function (e) {
			if (e.type == "shown") {
				if (_map.mapActive) {
					adjustMapSize(_map, _map.el.closest(".modal-dialog"));
					setTimeout(function () { _map.fitAllFeatures(); }, 50);
				}
			} else if (e.type == "hidden") {
				$myModalNodes.unbind("shown.bs.modal hidden.bs.modal", toggleModalVisibility);
			}
		}
		$myModalNodes.on("shown.bs.modal hidden.bs.modal", toggleModalVisibility);
		
		// Draw a polygon on the map and use it as the site footprint
		var createPolygonOnMap = function (footprint, isTile) {
			if (_map.mapActive) {
				var features = null;
				if (features = _map.createShapeFromGeometry(footprint, null, true)) {
					_map.fitAllFeatures();
					_map.restartActiveInteraction();
					if (isTile) {
						$("+.tagsinput .tag", $tileTags).addClass("match").data({ "footprint": features[0].getProperties()["textGeometry"] });
						showMsg("New footprint set", "INFO");
					}
				} else {
					showMsg("Inconsistent footprint information for the selected tile", "WARNING");
				}
			}
		};
		
		// Initialize map
		$mapExtent.poly2D({
			startLat     : 4,
			startLon     : 15,
			zoom         : 5,
			maxFeaturesNo: 1,
			loaded       : function (olPoly) {
				if (typeof olPoly.readOnly === "boolean") {
					$.extend(_map, olPoly);
					_map.el.removeClass("hidden");
					
					// Initialize the tags control
					initializeTagsControl($tileTags);
					
					// Create new tile polygon on map after a valid one is being set
					$tileTags.on("newtilefootprint", function (e, tilefootprint) {
						createPolygonOnMap(tilefootprint, true);
					});
					
					// Check whether the new footprint matches the tile footprint and mark the tile control accordingly
					_map.el.on("newfootprint", function (e, footprint) {
						var tagFootprint = $("+.tagsinput .tag", $tileTags).data("footprint");
						$('#frmEditSiteContainer [name="footprint"]').val(footprint);
						if (tagFootprint == footprint) {
							$("+.tagsinput .tag", $tileTags).addClass("match");
						} else {
							$("+.tagsinput .tag", $tileTags).removeClass("match");
						}
					});
					
					// Set initial footprint from input data
					if (initFootprint) {
						var geometry = initFootprint.replace("MULTIPOLYGON (((", "POLYGON((").replace(")))", "))").replace(" ((", "((");
						createPolygonOnMap(geometry);
					}
				}
			}
		});
	}
	
	//////////////////////////////////////////////////////////////////////////////////////
	$(document).ready( function() {
		var $form    = $("#frmEditSiteContainer");
		var initData = window?.userOpStack?.dna || {};
		
		// Read input form data
		initializeForm($form, initData);
		
		// Initialize date picker controls for startDate and endDate
		initializeDatepickerControls($("#startDate"), $("#endDate"));
		
		// Initialize map
		initializeMap(myPolygonMap, $("#mapExtent"), $("#polygon"), initData?.footprint);
		
		// Custom validations for container name (accepted characters & unique name)
		$.validator.addMethod("containerName", function (value, element, params) { return value.length == 0 || value.match(new RegExp(params.regEx, "g")); }, "Remove invalid characters ( site's name must be unique, only allowed small caps letters (a-z), numbers (0-9) and dashes (-)).")
		$.validator.addMethod("isUnique"     , function (value, element, params) { return $.inArray(value, nameList) == -1 || value == initData.name; }, "Site's name must be unique.");
		
		// Scroll element into view
		$("a.scroll-into-view, a.focus-on").on("click", function (e) {
			e.preventDefault();
			if ($(e.target).hasClass("scroll-into-view")) {
				$($(e.target).attr("href"))[0].scrollIntoView({ behavior: "smooth" });
			}
			if ($(e.target).hasClass("focus-on")) {
				$($(e.target).attr("href"))[0].focus();
			}
		});
		
		// Validate form before submit
		$form.validate({
			rules: {
				name       : { required: true, isUnique: true, containerName: { regEx: "^[a-zA-Z0-9- ]+$" } },
				description: { required: true },
				startDate  : { required: true },
				endDate    : { required: true },
				footprint  : { required: true }
			},
			highlight     : function(element, errorClass) { $(element).parent().addClass("has-error"); },
			unhighlight   : function(element, errorClass) { $(element).parent().removeClass("has-error"); },
			messages      : { },
			errorPlacement: function(error, element) {
				error.appendTo(element.parent());
				setTimeout(function () { adjustMapSize(myPolygonMap, myPolygonMap.el.closest(".modal-dialog")); }, 500);
			},
			success       : function(label) { label.remove(); }
		});
		
		// Disable form submit on keypress (Enter)
		$form.on("keyup keypress", ".form-control", function (e) {
			if ((e.keyCode || e.which) === 13) { e.preventDefault(); return false; }
		});
		
        // Submit form
		$form.submit(function (event) {
			event.preventDefault();
			var formData = {
				id         : initData.id,
				userId     : taoUserProfile.id,
				name       :        $('[name="name"       ]', this).val(),
				description:        $('[name="description"]', this).val(),
				startDate  : moment($('[name="startDate"  ]', this).val()).format("YYYY-MM-DDTHH:mm:ss"),
				endDate    : moment($('[name="endDate"    ]', this).val()).format("YYYY-MM-DDTHH:mm:ss"),
				footprint  :        $('[name="footprint"  ]', this).val()
			};
			
			if ($(this).valid()) {
				$(".modal-error").fadeOut();
				$.ajax({
					cache   : false,
					url     : baseRestApiURL + "site/" + formData.id,
					dataType: 'json',
					type    : "PUT",
					data    : JSON.stringify(formData),
					headers : {
						"Accept"      : "application/json",
						"Content-Type": "application/json",
						"X-Auth-Token": window.tokenKey
					},
					error: function (jqXHR, textStatus, errorThrown) {
						if (jqXHR.status === 500) {
							showMsg("Error updating site. Please check your data and try again.", "ERROR");
						} else {
							showMsg("Unknown error. Unable to update site. Please try again.", "ERROR");
						}
					},
					success: function(response,textStatus, jqXHR) {
						var r = chkTSRF(response);
						if (response.status === "FAILED") {
							if (response.message) {
								showMsg("Error updating site service. Please check your data, one or more values for the attributes were not correct.", "ERROR");
								//handle error messages
								
								var objResponse = JSON.parse(jqXHR.responseText);
								objResponse = objResponse.message.split(';');
								if (objResponse[0] !== "Entity has validation errors") {
									return;
								} 
								for (i = 0; i < objResponse.length; i ++) {
									var matches = objResponse[i].match(/\[(.*?)\]/);
									if (matches) {
										$(".error-"+matches[1],".modal-error").css('display', 'inline-block');
									}
								}
								$(".modal-error ").fadeIn("slow");
								$myModalNodes.animate({ scrollTop: 0 }, 250);
								return;
							}
							showMsg("Error updating site. Please check your data and try again.", "ERROR");
						}
						showMsg("Site successfully saved.", "SUCCESS");
						$myModalNodes.modal('hide');
						panelComp.refreshData();
					}
				});
			}
			return false; // To avoid actual submission of the form
		});
	});

//# sourceURL=sites-edit.js
</script>
