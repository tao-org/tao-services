<style>
	/* Style for the info popup */
	.col .inline_view{display:flex;}
	.info_popup{display:inline-flex;}
	div#list-config-accordion .info_popup_img.icon{cursor:pointer;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;background-image:url("assets/dist/img/icon-info.png");background-position:center;background-repeat:no-repeat;background-size:cover;width:16px;height:16px;}
	.info_popup .info_popup_text{position:absolute;visibility:hidden;text-align:center;margin-left:30px;}
	.info_popup_text::after,.info_popup_text::before{content:'';position:absolute;left:0.75vw;top:97%;z-index:2;border:solid 0.5em transparent;overflow:hidden;border-bottom:0;}
	.info_popup_text::after{top:100%;z-index:1;}
	.info_popup_text.show{visibility:visible;-webkit-animation:fadeIn 1s;animation:fadeIn 1s;z-index:1;text-align:center;bottom:2em;margin-left:-1vw;border-radius:10px;-webkit-border-radius:10px;width:fit-content;border-style:groove;bottom:110%;padding:2px;}
	
	/* Style for add icons */
	div#list-config-accordion .icon{border:1px solid transparent;border-radius:50%;width:22px;height:22px;padding:5px;background-position:50% 50%;background-repeat:no-repeat;background-color:transparent;}
	div#list-config-accordion .icon:focus{outline:none;}
</style>

<script>	
	var getGroupedConfigItems = function (categoryId) {
		var requestURL = baseRestApiURL + "config/detail/items?grouped=true";
		if (typeof categoryId !== "undefined") {
			requestURL = baseRestApiURL + "config/detail/items?grouped=true&category=" + categoryId;
		}
		return $.ajax({
			cache: false,
			url: requestURL,
			type: "GET",
			headers: {
				"Accept": "application/json",
				"Content-Type": "application/json",
				"X-Auth-Token": window.parent.tokenKey
			}
		});
	};
	
	function createSelectField(data, $columnDiv) {
		var selectField = $("select[id='select_frendlyName_KEY']", "#template_field").clone();
		var errorField = $("span.error-block", $columnDiv);
		var initialValue = (data.value === null || typeof data.value === "undefined") ? "" : String(data.value);
		var currentValue = (typeof data.pendingValue === "undefined") ? initialValue : String(data.pendingValue);

		$.each(data.values.allowed_values, function (index, value) {
			selectField.append('<option name="' + value.display + '" value="' + value.value + '">' + value.display +'</option>');
		});

		selectField.val(currentValue);
		selectField.attr("value", currentValue);
		selectField.data("originalValue", initialValue);

		$("div.input_select", $columnDiv).append(selectField.attr({ "id": data.id }));
		if (errorField.html()) {
			errorField.removeClass("hidden");
		}

	};

	function createTextField(data, currentValue, initialValue) {
		if (String(currentValue).length > 50) {
			return $("textarea[id='textarea_frendlyName_KEY']", "#template_field").clone()
				.val(currentValue)
				.attr({ "rows": 2 })
				.css("resize", "both")
				.data("originalValue", initialValue);
		}
		return $("input[id='input_frendlyName_KEY']", "#template_field").clone()
			.attr({ "type": "text", "value": currentValue })
			.data("originalValue", initialValue);
	}

	function createInputField(data, $columnDiv) {
		var inputField = $("input[id='input_frendlyName_KEY']", "#template_field").clone();
		var errorField = $("span.error-block", $columnDiv);
		var initialValue = (data.value === null || typeof data.value === "undefined") ? "" : String(data.value);
		var currentValue = (typeof data.pendingValue === "undefined") ? initialValue : String(data.pendingValue);
		switch (data.type) {
			case "int": case "float":
				try {
					inputField.attr({ "type": "number", "value": currentValue });
					if (data.values && data.values.bounds !== undefined && data.values.bounds !== null) {
						$.each(data.values.bounds, function (prop, value) {
							if (prop == "min" && value == "") {
								inputField.attr(prop, Number.MIN_VALUE);
							} else if (prop == "max" && value == "") {
								inputField.attr(prop, Number.MAX_VALUE);
							} else {
								inputField.attr(prop, value);
							}
						});
					}
				} catch (err) {
					inputField.attr({ "type": "text", "value": data.value }).addClass("error");
					errorField.html("Type changed to text: " + data.value +" is not " + data.type + ".");
				}
				break;
			case "date":
				inputField.attr({ "type": "text", "value": currentValue }).datetimepicker({ format: "YYYY-MM-DD", showClose: true }); break;
			case "bool": case "boolean":
				try {
					inputField.prop("checked", JSON.parse(currentValue));
					inputField.attr({ "type": "checkbox", "value": inputField.prop("checked") });
					inputField.addClass("switch_elem");
					initialValue = String(JSON.parse(initialValue));
				} catch (err) {
					inputField.attr({ "type": "text", "value": currentValue }).addClass("error");
					errorField.html("Type changed to text:" + currentValue + " is not " + data.type +".");
				}
				break;
			default:
				inputField = createTextField(data, currentValue, initialValue); break;
		}
		inputField.data("originalValue", initialValue);

		$("div.input_select", $columnDiv).append(inputField.attr({ "id": data.id }));
		if (errorField.html()) {
			errorField.removeClass("hidden");
		}
	};

	function normalizeFieldValue(field) {
		if ($(field).is(":checkbox")) {
			return String($(field).prop("checked"));
		}
		var value = $(field).val();
		if ($.isArray(value)) {
			return value.join(";");
		}
		return value === null || typeof value === "undefined" ? "" : String(value);
	}

	function hasConfigDependency(item) {
		return item &&
			item.dependsOnItemId !== null && typeof item.dependsOnItemId !== "undefined" && item.dependsOnItemId !== "" &&
			item.dependsOnItemValue !== null && typeof item.dependsOnItemValue !== "undefined";
	}

	function getConfigField($scope, itemId) {
		return $(".form-control", $scope).filter(function () {
			return this.id === itemId;
		}).first();
	}

	function getConfigColumn($scope, itemId) {
		return $("div.col", $scope).filter(function () {
			var configItem = $(this).data("configItem");
			return configItem && configItem.id === itemId;
		}).first();
	}

	function isSingleConfigItem(value) {
		return value &&
			typeof value === "object" &&
			!$.isArray(value) &&
			Object.prototype.hasOwnProperty.call(value, "id") &&
			Object.prototype.hasOwnProperty.call(value, "value") &&
			(
				Object.prototype.hasOwnProperty.call(value, "category") ||
				Object.prototype.hasOwnProperty.call(value, "type") ||
				Object.prototype.hasOwnProperty.call(value, "values")
			);
	}

	function normalizePendingConfigValues(pendingValues) {
		var values = {};
		if (typeof pendingValues === "undefined" || pendingValues === null) {
			return values;
		}
		if (isSingleConfigItem(pendingValues)) {
			values[pendingValues.id] = pendingValues.value;
			return values;
		}
		$.each(pendingValues, function (id, value) {
			values[id] = value;
		});
		return values;
	}

	function getCurrentConfigValues($formElem) {
		var values = {};
		$.each($(".form-control", $formElem), function (index, field) {
			values[$(field).attr("id")] = normalizeFieldValue(field);
		});
		return values;
	}

	function hasConfigDependents($formElem, itemId) {
		var hasDependents = false;
		$.each($formElem.data("configItems") || [], function (index, item) {
			if (String(item.dependsOnItemId) === String(itemId)) {
				hasDependents = true;
				return false;
			}
		});
		return hasDependents;
	}

	function getEffectiveConfigValues(items, pendingValues) {
		var values = {};
		$.each(items || [], function (idx, item) {
			if (!item) {
				return;
			}
			values[item.id] = (item.value === null || typeof item.value === "undefined") ? "" : String(item.value);
		});
		$.each(pendingValues || {}, function (id, value) {
			values[id] = (value === null || typeof value === "undefined") ? "" : String(value);
		});
		return values;
	}

	function isConfigDependencySatisfied(item, currentValues, visibleItems) {
		if (!hasConfigDependency(item)) {
			return true;
		}
		var parentId = String(item.dependsOnItemId);
		if (visibleItems[parentId] === false || !Object.prototype.hasOwnProperty.call(currentValues, parentId)) {
			return false;
		}
		return String(currentValues[parentId]) === String(item.dependsOnItemValue);
	}
	
	function updateDependentConfig(category, dependsOnItem) {
		$.when(getGroupedConfigItems(category)).done(function(groupedConfigItemsResponse) {
			var categoryItems = chkTSRF(groupedConfigItemsResponse);
			var sortedItems = sortByDependsOn(categoryItems);
			var $accordion = $("#list-config-accordion");
			var categoryName = categoryItems[0].category.name;
			var idCategoryName = (categoryName.toLowerCase()).replace(/ /g, "-");
			var $category = $accordion.find("div[id='" + idCategoryName + "-panel']");
			$("form",$category).children().not('input[type="hidden"], div.row.submit-buttons').remove();
			createCategoryFormContent($category, sortedItems, dependsOnItem);
		});
	}
	
	function sortByDependsOn(items) {
		var sortedItems = [];
		var remainingItems = (items || []).slice();
		var sortedIds = {};
		while (remainingItems.length) {
			var appended = false;
			for (var idx = 0; idx < remainingItems.length; idx++) {
				var item = remainingItems[idx];
				if (!hasConfigDependency(item) || sortedIds[item.dependsOnItemId]) {
					sortedItems.push(item);
					sortedIds[item.id] = true;
					remainingItems.splice(idx, 1);
					appended = true;
					idx--;
				}
			}
			if (!appended) {
				return sortedItems.concat(remainingItems);
			}
		}
		return sortedItems;
	}
	
	function createCategoryFormContent($categoryElem, items, dependsOnItem) {
		var $formElem = $("form", $categoryElem);
		var pendingValues = normalizePendingConfigValues(dependsOnItem);
		var currentValues = getEffectiveConfigValues(items, pendingValues);
		var visibleItems = {};
		$formElem.data("configItems", items);
		// hidden fields for category
		$("input[name='categoryId']", $formElem).val(items[0].category.id);
		var hasConfigDependencyRestriction = false;
		$formElem.removeClass("config-dependency-hidden");
		$.each(items, function(idx, item) {
			var itemData = $.extend(true, {}, item);
			if (Object.prototype.hasOwnProperty.call(pendingValues, itemData.id)) {
				itemData.pendingValue = pendingValues[itemData.id];
			}
			var shouldShow = isConfigDependencySatisfied(itemData, currentValues, visibleItems);
			visibleItems[itemData.id] = shouldShow;
			if (!shouldShow) {
				hasConfigDependencyRestriction = true;
				return true;
			}
			var $configEntryDiv;
			var $columnDiv;
			if (!$("div.row:not(.submit-buttons)", $formElem).length || $("div.col", $("div.row:not(.submit-buttons)", $formElem).last()).length == 3) {
				$configEntryDiv = $("div.row", "#template_row").clone();
			} else {
				$configEntryDiv = $("div.row:not(.submit-buttons)", $formElem).last();
			}
			$columnDiv = $("div.col", "#template_col").clone().attr("id", ("col_" + itemData.id)).data("configItem", itemData);
			// config entry name and value
			$("label[for='frendlyName_KEY']", $columnDiv).attr("for", itemData.id).html((itemData.label !== "not set" && itemData.label !== "") ? itemData.label : itemData.id + ":");
			$("span.info_popup_text", $columnDiv).html(itemData.friendlyName);
			//select the input type
			if (itemData.values && itemData.values.allowed_values !== undefined && itemData.values.allowed_values !== null && itemData.values.allowed_values.length > 0) {
				createSelectField(itemData, $columnDiv);
			} else {
				createInputField(itemData, $columnDiv);
			}
			// add field to form
			$configEntryDiv.append($columnDiv);
			$configEntryDiv.insertBefore($("div.row.submit-buttons", $formElem));
			
		});
		if (hasConfigDependencyRestriction) {
			$formElem.addClass("config-dependency-hidden");
		}
		
		//add bootstrapSwitch on all checkboxes
		$("input[type='checkbox'].switch_elem", $categoryElem).bootstrapSwitch({
			size: bootstrapSwitchSize(taoUserProfile.preferences["body_size"]),
			onColor: "success",
			offColor: "default",
			onText: "TRUE",
			offText: "FALSE"
		});
	};
		
	function refreshPage() {
		$.when(getGroupedConfigItems()).done(function(groupedConfigItemsResponse) {
			var categoryList = chkTSRF(groupedConfigItemsResponse);
			var $accordion = $("#list-config-accordion");
			//$accordion.html("");
			if (categoryList !== null && !$.isEmptyObject(categoryList)) {
				$.each(categoryList, function (categoryName, items) {
					var sortedItems = sortByDependsOn(items);
					idCategoryName = (categoryName.toLowerCase()).replace(/ /g, "-");
					if( $("#"+ idCategoryName + "-panel").length > 0 ){
						$("#"+ idCategoryName + "-panel").remove();
					}
					var composedId = idCategoryName + "-category-list";
					var $category = $("#template-panel").clone().attr("id", idCategoryName + "-panel");
					$(".panel-title a", $category).html(categoryName).attr({"data-parent": "#list-config-accordion", "href": "#" + composedId});
					$(".panel-body", $category).attr("id", composedId);
					createCategoryFormContent($category, sortedItems);
					$accordion.append($category);
				});
				$(".nppaginatedcells-empty").hide();
			} else {
				$(".nppaginatedcells-empty").show();
			}
		});
	};
	
	$(document).ready(function() {
		
		refreshPage();
		
		$("#list-config-accordion").on("click", ".info_popup_img", function (e) {
			e.preventDefault();
			if ($(this).siblings(".info_popup_text").hasClass("show")) {
				$(this).siblings(".info_popup_text").removeClass("show");
			} else {
				$(this).closest("#list-config-accordion").find(".info_popup_text.show").removeClass("show");
				$(this).siblings(".info_popup_text").addClass("show");
			}
		});
		
		$("#list-config-accordion").on("click", "a[data-parent='#list-config-accordion']", function (e) {
			$("#list-config-accordion").find(".info_popup_text.show").removeClass("show")
		});
		
		$("#list-config-accordion").on("click", "input[name='save']", function (e) {
			e.preventDefault();
			var configItem;
			var configItemList = [];
			
			$.each($(".form-control", this.closest("form")).filter(function () {
				return !$(this).hasClass("config-dependency-hidden");
			}), function (index, field) {
				var originalValue = $(field).data("originalValue");
				if (typeof originalValue === "undefined") {
					originalValue = $(field).attr("value");
				}
				var currentValue = normalizeFieldValue(field);
				var normalizedOriginal = String(originalValue === null || typeof originalValue === "undefined" ? "" : originalValue);
				if (currentValue !== normalizedOriginal) {
					configItem = $(field.closest("div[id='col_" + $(field).attr("id") + "']")).data("configItem");
					if ($(field).is(":checkbox")) {
						configItem.value = $(field).prop("checked");
					} else {
						configItem.value = currentValue;
					}
					configItemList.push(configItem);
				}
			});

			if (!configItemList.length) {
				showMsg("No configuration changes to save", "INFO");
				return;
			}
			
			$.ajax({
				cache: false,
				url: baseRestApiURL + "config/detail/items",
				data: JSON.stringify(configItemList),
				type: "POST",
				headers: {
					"Accept": "application/json",
					"Content-Type": "application/json",
					"X-Auth-Token": window.tokenKey
				},
				error : function (jqXHR, textStatus, errorThrown) {
					if (jqXHR.status === 500) {
						showMsg("Error updating container. Please check your data and try again.", "ERROR");
						return;
					}
					showMsg("Unable to update configuration. Please try again.", "ERROR");
				},
				success: function(response, textStatus, jqXHR) {
					if (typeof response.message !== "undefined" && response.message !== null && response.message !== "") {
						showMsg(response.message, "SUCCESS");
					} else {
						showMsg(configItemList.length + " configuration items saved", "SUCCESS");
					}
					refreshPage();
				}
			});
		});

		$("#list-config-accordion").on("change switchChange.bootstrapSwitch", ".form-control", function () {
			var configItem = $(this).closest("div.col").data("configItem");
			var $formElem = $(this).closest("form");
			if (configItem && hasConfigDependents($formElem, configItem.id)) {
				updateDependentConfig($formElem.find("input[name='categoryId']").val(), getCurrentConfigValues($formElem));
			}
		});
		
		$(".wrapper").on("click", function(e){
			if($(".info_popup_text",".info_popup").hasClass("show") && !$(e.target).hasClass("info_popup_img icon")){
				$(".info_popup_text",".info_popup").removeClass("show")
			}
		});
	});
	//# sourceURL=configuration.js
</script>
